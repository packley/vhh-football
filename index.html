};

/* ---------------- main loop ---------------- */
let last=performance.now();
let lastDraw=0;
function frame(now){
  requestAnimationFrame(frame);
  // cap at ~60fps: 120Hz phones were doing double work for a pixel game,
  // which is how pockets catch fire
  if(now-lastDraw<14) return;
  lastDraw=now;
  const raw=Math.min(0.05,(now-last)/1000); last=now;
  let dt=raw;
  G.t+=raw;
  // consume taps
  let tapped=taps.length>0; taps.length=0;

  if(hitstop>0){ hitstop-=raw; dt=0; } // freeze gameplay during a VERY HARD HIT
  updateFx(raw);                       // fx, shake and shouts always tick
  // a running clock runs BETWEEN plays too — through the spot, the huddle, your indecision
  if(!G.convChoice&&!G.kickChoice){
    if(G.state==='dead'&&G.deadOpts&&G.deadOpts.runoff&&G.clock>0)
      G.clock=Math.max(0,G.clock-raw);
    else if(G.clockRunning&&(G.state==='playcall'||G.state==='snap')){
      G.clock=Math.max(0,G.clock-raw);
      if(G.clock<=0&&G.state==='playcall'){ G.clockRunning=false; handleClockExpiry(); }
    }
  }

  ctx.save();
  if(shake>0) ctx.translate(rnd(-shake,shake)*0.5,rnd(-shake,shake)*0.5);
  if(zoomPunch>0){ // punch-zoom: the camera flinches with the hit
    const z=1+zoomPunch;
    ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-W/2,-H/2);
  }

  switch(G.state){
    case 'boot':
      // tap gate: browsers refuse to play audio until a user gesture,
      // and the intro deserves its score
      if(!fieldCv) buildField();       // pre-bake the heavy art while the player
      if(!G.titleArt) buildTitleArt(); // reads the boot screen — no mid-game hitch
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
      pixelText('TOTAL NOG PRODUCTIONS',W/2,H*0.42,22,'#888',null,true);
      pixelText('PRESENTS',W/2,H*0.47,16,'#555',null,true);
      if(Math.floor(G.t*2)%2===0)pixelText('TAP TO BEGIN',W/2,H*0.62,26,'#fff200','#000',true);
      pixelText('SOUND ON. TRUST US.',W/2,H*0.68,14,'#666',null,true);
      if(tapped){ startIntroMusic(); setState('intro'); }
      break;
    case 'intro':
      if(G.introMusicWanted) realStartIntroMusic(G.introT); // late unlock: join the score in progress
      drawIntro(dt);
      if(tapped&&G.introT>0.5){ stopIntroMusic(); setState('title'); }
      break;
    case 'title':
      drawTitle(dt);
      if(tapped&&G.t>0.4) advanceTap();
      break;
    case 'howto':
      drawHowTo();
      if(tapped&&G.t>0.4) advanceTap();
      break;
    case 'playcall':
      if(buttons.length===0) setupPlaycallButtons();
      G.camY=lerp(G.camY,yd2y(G.losYd)-H*0.55,1-Math.pow(0.9,dt*60));
      drawPlaycall();
      break;
    case 'snap':
      drawField(G.camY);drawHUD();
      pixelText('HUT... HUT...',W/2,H*0.45,34,'#fff','#000',true);
      if(G.t>0.5) setupPlay(G.pendingPlay);
      break;
    case 'live':
      if(dt>0&&G.playLive) updateLive(dt);
      drawField(G.camY);
      for(const p of G.players) drawPlayer(p,G.camY);
      drawBallFlight(G.camY);
      drawFxWorld(G.camY);
      drawHUD(); drawButtons(); drawFxScreen();
      break;
    case 'dead': {
      G.playDeadT+=dt;
      const isTd=G.deadOpts&&G.deadOpts.td;
      if(isTd&&G.carrier){ // end zone celebration: hopping and fireworks
        G.carrier.y=G.celebBase-Math.abs(Math.sin(G.playDeadT*7))*16;
        G.carrier.moving=true; G.carrier.animT+=dt*1.6;
        if(frameCount%7===0) spawnStars(G.carrier.x+rnd(-44,44),G.carrier.y+rnd(-34,10),5);
      }
      drawField(G.camY);
      for(const p of G.players) drawPlayer(p,G.camY);
      drawFxWorld(G.camY); drawHUD(); drawFxScreen();
      if(G.deadMsg&&G.playDeadT>0.25)
        pixelText(G.deadMsg,W/2,H*0.5,30,'#fff','#000',true);
      if(G.playDeadT>(isTd?2.3:1.15)) afterPlay();
      break; }
    case 'banner': {
      drawField(G.camY); drawHUD(); drawFxWorld(G.camY); drawFxScreen();
      const b=G.banner; b.t+=dt;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H*0.32,W,H*0.3);
      ctx.fillStyle='#fff200';ctx.fillRect(0,H*0.32,W,4);ctx.fillRect(0,H*0.62-4,W,4);
      b.lines.forEach((ln,i)=>pixelText(ln,W/2,H*0.40+i*36,i===0?30:24,i===0?'#fff200':'#fff','#000',true));
      if(b.t>b.dur){ const nx=b.next; G.banner=null; nx(); }
      break; }
    case 'simdrive': {
      const s=G.sim; s.t+=dt;
      drawField(G.camY); drawHUD(); drawFxScreen();
      ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,H*0.25,W,H*0.42);
      pixelText(TEAM_CPU.name+' BALL...',W/2,H*0.31,26,'#b06aff','#000',true);
      if(s.t>0.8)pixelText(s.lines[0],W/2,H*0.40,18,'#ccc',null,true);
      if(s.t>1.7)pixelText(s.lines[1],W/2,H*0.46,18,'#ccc',null,true);
      if(s.t>1.0&&!s.c1){s.c1=true;sfx.thud();}
      // Q4/OT: the one-tap defensive stand — nail the sweeping marker to blow up the play
      if(s.qte&&!s.qte.done&&s.t>0.8&&s.t<2.6){
        s.qte.pos+=s.qte.dir*dt*1.2;
        if(s.qte.pos>1){s.qte.pos=1;s.qte.dir=-1;} if(s.qte.pos<0){s.qte.pos=0;s.qte.dir=1;}
        const bx=W*0.15,bw=W*0.7,by=H*0.70;
        pixelText('TAP TO BLOW IT UP!',W/2,by-26,18,'#7dff6a','#000',true);
        ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(bx,by,bw,16);
        ctx.fillStyle='rgba(125,255,106,0.5)';ctx.fillRect(bx+bw*0.39,by,bw*0.22,16);
        ctx.fillStyle='#fff';ctx.fillRect(bx+bw*s.qte.pos-2,by-4,4,24);
        if(tapped){
          s.qte.done=true;
          if(Math.abs(s.qte.pos-0.5)<0.11){
            s.qte.hit=true; s.outcome='stuffed'; s.pts=0;
            s.resultLines=[pick(SIM_DEF),'YOU BLEW IT UP YOURSELF!'];
            sfx.megacrunch(); shake=14; zoomPunch=0.08;
          } else {
            s.resultLines[1]=(s.resultLines[1]||'')+' (YOU MISSED THE TACKLE)';
            sfx.thud();
          }
        }
      }
      if(s.t>1.9&&!s.c2){s.c2=true;if(s.outcome==='stuffed'){sfx.megacrunch();shake=10;}else sfx.thud();}
      if(s.t>2.7){
        s.resultLines.forEach((ln,i)=>pixelText(ln,W/2,H*0.54+i*30,22,i===0?'#fff200':'#fff','#000',true));
        if(!s.scored){s.scored=true;G.score.cpu+=s.pts;if(s.pts>0)sfx.fail();else sfx.firstDown();}
      }
      if(s.t>4.2){ G.lastSimOutcome=s.outcome; G.sim=null; endQuarter(); }
      break; }
    case 'kickmeter': { // aiming happens INSIDE the field-level view
      const k=G.kick;
      k.t+=dt;
      k.pos+=k.dir*dt*1.4;
      if(k.pos>1){k.pos=1;k.dir=-1;} if(k.pos<0){k.pos=0;k.dir=1;}
      drawKickScene(k.type,k.distYds);
      if(k.type!=='punt'){ drawRef(108,545,2.2,'idle'); drawRef(372,545,2.2,'idle'); }
      // kicker set and waiting, ball on the tee
      drawBigGuy(150,610,TEAM_YOU,'brace',false,true);
      ctx.fillStyle='#8a4b1f'; ctx.fillRect(235,586,10,14);
      ctx.fillStyle='#fff'; ctx.fillRect(239,590,2,6);
      // the meter, on the turf in front of you
      pixelText('TAP TO KICK!',W/2,668,20,'#fff','#000',true);
      const bx=W*0.12,bw=W*0.76,by=700;
      ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(bx-8,by-10,bw+16,40);
      ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(bx,by,bw,20);
      const win=k.type==='punt'?0.5:k.window;
      ctx.fillStyle='rgba(125,255,106,0.5)';
      ctx.fillRect(bx+bw*(0.5-win/2),by,bw*win,20);
      ctx.fillStyle='#fff';ctx.fillRect(bx+bw*k.pos-2,by-5,4,30);
      drawHUD(); drawFxScreen();
      if(tapped||k.t>4.2) resolveKick(); // hesitate forever and the snap gets away from you
      break; }
    case 'kickanim': { // ...and the same view continues: YOUR tap becomes the flight
      const a=G.kickAnim; a.t+=dt;
      drawKickScene(a.type,a.distYds);
      const RUN=0.55, teeX=240, teeY=600;
      if(a.t<RUN){ // the approach
        drawBigGuy(150+(a.t/RUN)*74,610,TEAM_YOU,'run',false,true);
        ctx.fillStyle='#8a4b1f'; ctx.fillRect(teeX-5,teeY-14,10,14);
        ctx.fillStyle='#fff'; ctx.fillRect(teeX-1,teeY-10,2,6);
      } else {
        if(!a.kicked){ a.kicked=true; sfx.thud(); noise(0.35,0.15,2800); spawnDust(teeX,teeY); }
        drawBigGuy(226,608,TEAM_YOU,'brace',false,true); // follow-through
        const k=Math.min((a.t-RUN)/1.0,1.0);
        // lateral drift: inside the posts, off the post, or wide — per your tap
        const spread=a.type==='punt'?(10+a.offCenter*50)
                    :a.good?(a.offCenter/Math.max(a.window,0.01))*80
                    :(a.doink?106:135+Math.min(85,(a.offCenter-a.window)*220));
        let bx=lerp(teeX,240+a.side*spread,k);
        let by=a.type==='punt'
          ? teeY-14-620*k+90*k*k       // punts climb higher and just keep going
          : teeY-14-500*k+150*k*k;     // FG/XP: up and away at the posts
        let scale=1-0.55*k;            // shrinking with distance
        if(a.doink&&k>=1){ // CLANG. the post wins.
          const pb=a.t-RUN-1.0;
          bx=240+a.side*106; by=236+pb*260; scale=0.45+pb*0.15;
        } else if(k>=1){ // sails on
          const pb=a.t-RUN-1.0;
          bx+=a.side*(a.good?8:46)*pb;
          by=(a.type==='punt'?56:236)-pb*(a.type==='punt'?220:36);
          scale=Math.max(0.22,0.45-pb*0.1);
        }
        ctx.save(); ctx.translate(bx,by); ctx.rotate((a.t-RUN)*12); ctx.scale(scale,scale);
        ctx.fillStyle='#8a4b1f'; ctx.fillRect(-7,-5,14,10);
        ctx.fillStyle='#fff'; ctx.fillRect(-1.5,-5,3,10);
        ctx.restore();
        if(k>=1&&!a.resolved){
          a.resolved=true;
          if(a.type==='punt'){ if(a.offCenter<0.25) bigText('MOONSHOT.',{size:28,color:'#9fd8ff',dur:1.0}); }
          else if(a.good){ sfx.td(); sfx.cheer(); flashWhite=0.08; spawnStars(bx,by,10);
            bigText('IT’S GOOD!',{size:40,color:'#7dff6a',dur:1.3}); }
          else if(a.doink){ tone(420,0.5,'square',0.3,250); tone(630,0.3,'square',0.15,380); shake=10;
            bigText('DOINK!!',{size:38,color:'#ff9f50',dur:1.3}); }
          else { sfx.fail();
            bigText(a.side<0?'WIDE LEFT!':'WIDE RIGHT!',{size:34,color:'#ff5050',dur:1.3}); }
        }
      }
      if(a.type!=='punt'){ // the officials, tracking it the whole way
        const pose=!a.resolved?'idle':(a.good?'good':'no');
        drawRef(108,545,2.2,pose,a.t);
        drawRef(372,545,2.2,pose,a.t);
      }
      drawHUD(); drawFxWorld(0); drawFxScreen();
      if(a.t>RUN+(a.type==='punt'?1.5:2.1)) finishKick();
      break; }
    case 'mode': {
      if(buttons.length===0){
        buttons.push({id:'mode_quick',rect:true,x:40,y:H*0.40,w:W-80,h:88,label:'QUICK GAME',sub:'THE CLASSIC GRUDGE: VS THE BRUISERS'});
        buttons.push({id:'mode_tourney',rect:true,x:40,y:H*0.40+104,w:W-80,h:88,label:'TOURNAMENT',sub:'THE 1994 INVITATIONAL: 8 TEAMS, 1 CROWN'});
      }
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      pixelText('CHOOSE YOUR VIOLENCE',W/2,H*0.22,30,'#fff200','#000',true);
      drawButtons();
      break; }
    case 'bracket': {
      const T=G.tour;
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      pixelText('THE VHH INVITATIONAL',W/2,70,26,'#fff200','#000',true);
      pixelText(ROUND_NAMES[T.round],W/2,108,22,'#fff','#000',true);
      let y=170;
      for(const m of T.matches){
        const mine=m[0]===TEAM_YOU||m[1]===TEAM_YOU;
        if(mine){ ctx.strokeStyle='#fff200'; ctx.lineWidth=3; ctx.strokeRect(60,y-24,W-120,82); }
        [m[0],m[1]].forEach((t2,i)=>{
          ctx.fillStyle=t2.jersey; ctx.fillRect(86,y-12+i*36,18,18);
          pixelText(t2.city+' '+t2.name,116,y-3+i*36,17,t2===TEAM_YOU?'#00e5cf':'#ddd',null,false);
        });
        pixelText(mine?'YOU':'SIM',W-86,y+15,14,mine?'#fff200':'#666',null,true);
        y+=104;
      }
      if(T.lastResults){
        pixelText('LAST ROUND:',W/2,y+6,15,'#888',null,true);
        T.lastResults.forEach((r,i)=>pixelText(r,W/2,y+28+i*20,14,'#aaa',null,true));
        y+=28+T.lastResults.length*20+14;
      }
      { // the Invitational stat sheet so far
        const ts=T.stats||{}, tv=(n,k)=>(ts[n]&&ts[n][k])||0;
        const D='DIRK THUNDER', R='REX HAMBONE';
        if(ts[D]||ts[R]){
          pixelText('INVITATIONAL TOTALS:',W/2,y+6,15,'#888',null,true);
          pixelText('THUNDER: '+tv(D,'comp')+'/'+tv(D,'att')+', '+tv(D,'passYds')+' YDS, '+tv(D,'passTD')+' TD'
            +(tv(D,'int')?', '+tv(D,'int')+' INT':''),W/2,y+27,14,'#00e5cf',null,true);
          pixelText('HAMBONE: '+tv(R,'rushYds')+' RUSH YDS, '+tv(R,'rushTD')+' TD, '+tv(R,'vhh')+' VHH',
            W/2,y+46,14,'#00e5cf',null,true);
        }
      }
      if(Math.floor(G.t*2)%2===0)
        pixelText('TAP TO PLAY YOUR GAME',W/2,H*0.92,22,'#fff','#000',true);
      if(tapped&&G.t>0.4) startTourGame();
      break; }
    case 'champion': {
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      for(let i=0;i<4;i++){
        const fx=(i*120+60+Math.sin(G.t*2+i*2)*30);
        spawnLite(fx,140+((G.t*150+i*180)%420));
      }
      // the trophy
      const tx=W/2,ty=H*0.36;
      ctx.fillStyle='#ffd700';
      ctx.fillRect(tx-34,ty-50,68,14);                  // rim
      ctx.beginPath();ctx.moveTo(tx-34,ty-36);ctx.lineTo(tx+34,ty-36);ctx.lineTo(tx+14,ty+8);ctx.lineTo(tx-14,ty+8);ctx.fill(); // bowl
      ctx.fillRect(tx-5,ty+8,10,26);                    // stem
      ctx.fillRect(tx-26,ty+34,52,10);                  // base
      ctx.strokeStyle='#ffd700';ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(tx-40,ty-22,16,Math.PI*0.5,Math.PI*1.5);ctx.stroke(); // handles
      ctx.beginPath();ctx.arc(tx+40,ty-22,16,-Math.PI*0.5,Math.PI*0.5);ctx.stroke();
      pixelText('CHAMPIONS',W/2,H*0.55,44,'#fff200','#7a1010',true);
      pixelText('OF THE 1994 VHH INVITATIONAL',W/2,H*0.60,18,'#fff',null,true);
      { // tournament run, etched on the trophy
        const ts=(G.tour&&G.tour.stats)||{}, tv=(n,k)=>(ts[n]&&ts[n][k])||0;
        pixelText('THUNDER: '+tv('DIRK THUNDER','passYds')+' YDS, '+tv('DIRK THUNDER','passTD')+' TD'
          +'  •  HAMBONE: '+tv('REX HAMBONE','rushYds')+' YDS, '+tv('REX HAMBONE','rushTD')+' TD',
          W/2,H*0.655,14,'#00e5cf',null,true);
        let vhh=0; for(const n in ts) vhh+=ts[n].vhh||0;
        pixelText('VERY HARD HITS THIS TOURNAMENT: '+vhh,W/2,H*0.69,14,'#7dff6a',null,true);
      }
      const sr2=seriesText();
      if(sr2) pixelText(sr2,W/2,H*0.75,15,'#fff200',null,true);
      pixelText('TEXT HIM. TEXT HIM RIGHT NOW.',W/2,H*0.81,18,'#fff200','#000',true);
      if(Math.floor(G.t*2)%2===0)pixelText('TAP TO RETURN',W/2,H*0.89,18,'#fff','#000',true);
      drawFxScreen2();
      if(tapped&&G.t>1.0){ G.tour=null; setState('title'); }
      break; }
    case 'gameover': {
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      const win=G.result==='win';
      if(win){
        for(let i=0;i<3;i++){
          const fx=(i*160+80+Math.sin(G.t*2+i*2)*30), fy=120+((G.t*120+i*200)%500);
          spawnLite(fx,600-fy+120);
        }
      }
      pixelText(win?'SKULLCRUSHERS':TEAM_CPU.name,W/2,H*0.18,40,win?'#00e5cf':TEAM_CPU.stripe,'#000',true);
      pixelText(win?'WIN!':(G.score.you===G.score.cpu?'WIN IN OT!':'WIN!'),W/2,H*0.24,48,'#fff200','#000',true);
      pixelText('FINAL: SKL '+G.score.you+' — '+TEAM_CPU.abbr+' '+G.score.cpu,W/2,H*0.34,24,'#fff',null,true);
      if(!win&&G.score.you===G.score.cpu)
        pixelText('OT RULE: SCORE OR LOSE. YOU KNOW WHAT YOU DID.',W/2,H*0.385,14,'#999',null,true);
      const sr=seriesText();
      if(sr) pixelText(sr,W/2,H*0.59,17,'#fff200',null,true);
      pixelText('VERY HARD HITS DELIVERED: '+G.vhhCount,W/2,H*0.44,20,'#7dff6a',null,true);
      pixelText('VERY HARD HITS RECEIVED: '+G.vhhTaken,W/2,H*0.49,20,'#ff8080',null,true);
      pixelText('LONGEST PLAY: '+G.longestPlay+' YDS',W/2,H*0.54,20,'#9fd8ff',null,true);
      pixelText(win?'TEXT YOUR FRIEND. TALK TRASH.':'REMATCH. IMMEDIATELY.',W/2,H*0.66,22,'#fff200','#000',true);
      if(G.tour) pixelText(win?ROUND_NAMES[G.tour.round]+' — SURVIVED':'ELIMINATED FROM THE INVITATIONAL',
        W/2,H*0.715,16,win?'#7dff6a':'#ff8080',null,true);
      if(Math.floor(G.t*2)%2===0)
        pixelText('TAP FOR THE BOX SCORE',W/2,H*0.78,24,'#fff','#000',true);
      pixelText('EST. 1994 • SHIPPED 2026',W/2,H*0.9,14,'#777',null,true);
      drawFxScreen2();
      if(tapped&&G.t>1.0) setState('boxscore');
      break; }
    case 'boxscore': {
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      pixelText('BOX SCORE',W/2,64,30,'#fff200','#000',true);
      pixelText('SKL '+G.score.you+' — '+TEAM_CPU.abbr+' '+G.score.cpu,W/2,98,18,'#aaa',null,true);
      const gs=G.gstats||{}, car=loadCareers();
      const v=(s,k)=>(s&&s[k])||0;
      let y=150;
      const row=(who,line,careerLine)=>{
        pixelText('#'+who.num+' '+who.name,40,y,18,'#00e5cf',null,false);
        pixelText(line,40,y+22,16,'#fff',null,false);
        if(careerLine) pixelText(careerLine,40,y+41,12,'#777',null,false);
        y+=72;
      };
      const q=gs[ROSTER.QB.name], cq=car[ROSTER.QB.name];
      row(ROSTER.QB,
        v(q,'comp')+'/'+v(q,'att')+', '+v(q,'passYds')+' YDS, '+v(q,'passTD')+' TD'
          +(v(q,'int')?', '+v(q,'int')+' INT':'')+(v(q,'rushYds')?'  •  '+v(q,'rushYds')+' RUSH':''),
        cq?('CAREER: '+(cq.passYds||0)+' YDS, '+(cq.passTD||0)+' TD, '+(cq.games||0)+' GAMES'):null);
      const r2=gs[ROSTER.RB.name], cr=car[ROSTER.RB.name];
      row(ROSTER.RB,
        v(r2,'rushYds')+' RUSH YDS, '+v(r2,'rushTD')+' TD'
          +(v(r2,'rec')?'  •  '+v(r2,'rec')+' REC '+v(r2,'recYds')+' YDS':'')
          +(v(r2,'vhh')?'  •  '+v(r2,'vhh')+' VHH':''),
        cr?('CAREER: '+(cr.rushYds||0)+' RUSH YDS, '+(cr.rushTD||0)+' TD'):null);
      for(const key of ['WRA','WRB']){
        const w2=gs[ROSTER[key].name], cw=car[ROSTER[key].name];
        row(ROSTER[key],
          v(w2,'rec')+' REC, '+v(w2,'recYds')+' YDS, '+v(w2,'recTD')+' TD',
          cw?('CAREER: '+(cw.recYds||0)+' REC YDS, '+(cw.recTD||0)+' TD'):null);
      }
      const rt=gs[ROSTER.RET.name];
      if(v(rt,'retYds')||v(rt,'retTD'))
        row(ROSTER.RET,v(rt,'retYds')+' RETURN YDS'+(v(rt,'retTD')?', '+v(rt,'retTD')+' TD':''),null);
      const kk2=gs[ROSTER.K.name];
      if(v(kk2,'fga')||v(kk2,'xpa'))
        row(ROSTER.K,v(kk2,'fgm')+'/'+v(kk2,'fga')+' FG, '+v(kk2,'xpm')+'/'+v(kk2,'xpa')+' XP',null);
      if(Math.floor(G.t*2)%2===0)
        pixelText(G.tour?(G.result==='win'?'TAP FOR THE BRACKET':'TAP. GO HOME.'):'TAP FOR REMATCH',W/2,H*0.93,20,'#fff','#000',true);
      if(tapped&&G.t>0.4){
        if(G.tour){
          if(G.result==='win') advanceTournament();
          else { G.tour=null; setState('title'); }
        } else setState('title');
      }
      break; }
  }
  ctx.restore();
  // watchdog: iOS can leave the context suspended/interrupted — keep nudging it
  if(AU.on&&frameCount%30===0&&AU.ctx.state!=='running'){ try{AU.ctx.resume();}catch(e){} }
  if(DEBUG){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H-46,W,46);
    const ss=window.speechSynthesis;
    pixelText('au:'+(AU.on?AU.ctx.state:'off')+' tts:'+ttsDebug,8,H-32,13,'#7dff6a',null,false);
    pixelText(ss?('v:'+ss.getVoices().length+' spk:'+ss.speaking+' pen:'+ss.pending+' pau:'+ss.paused):'no-tts',8,H-13,13,'#7dff6a',null,false);
  }
  frameCount++;
}
let frameCount=0;
const liteParts=[];
function spawnLite(x,y){
  if(Math.random()<0.15)liteParts.push({x,y,t:0,c:pick(['#fff200','#00e5cf','#b06aff','#ff5050'])});
}
function drawFxScreen2(){
  for(let i=liteParts.length-1;i>=0;i--){
    const p=liteParts[i];p.t+=0.016;
    ctx.fillStyle=p.c;
    for(let a=0;a<6;a++){
      const an=a/6*Math.PI*2+p.t*3;
      ctx.fillRect(p.x+Math.cos(an)*p.t*120,p.y+Math.sin(an)*p.t*120,4,4);
    }
    if(p.t>0.7)liteParts.splice(i,1);
  }
}
requestAnimationFrame(frame);
</script>
</body>

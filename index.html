      ctx.restore();ctx.globalAlpha=1;
      if(!G.introCatchDone){G.introCatchDone=true;sfx.boom();shake=12;}
    }
    // ...and underneath, the quiet truth
    fadeLine('SO THEY ONLY DID THE COVER ART.',10.8,H*0.56,20,'#888');
  } else if(t<14.8){
    // darkness, crescendo still climbing... then:
    if(t>13.8){
      const k=clamp((t-13.8)/0.25,0,1);
      ctx.save();ctx.translate(W/2,H*0.48);ctx.scale(2.2-1.2*k,2.2-1.2*k);ctx.globalAlpha=k;
      pixelText('UNTIL NOW.',0,0,38,'#fff200','#000',true);
      ctx.restore();ctx.globalAlpha=1;
      if(!G.introUntilDone){G.introUntilDone=true;sfx.boom();shake=8;}
    }
  } else {
    // side view field strip
    const gy=H*0.55;
    ctx.fillStyle='#0d2d12';ctx.fillRect(0,gy-120,W,240);
    ctx.fillStyle='#1c7a2e';ctx.fillRect(0,gy+24,W,80);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    for(let x=20;x<W;x+=70)ctx.fillRect(x,gy+24,3,80);
    // crowd
    for(let y=0;y<70;y+=8)for(let x=0;x<W;x+=8) if((x*7+y*13)%5<2){ctx.fillStyle=['#444','#665','#556'][(x+y)%3];ctx.fillRect(x,gy-118+y,5,5);}
    const ts=t-14.8;
    const impactT=3.4, FREEZE=0.2; // a longer, happier jog — more song before the consequences
    const SPD=48;                   // px/sec — a leisurely, doomed amble
    const ix=70+SPD*impactT;        // ~233: contact lands left of center, room to see it coming
    const cx=ix+30;                 // tackler contact position
    if(ts<impactT){
      // runner jogs right, blissfully unaware, whistling to himself
      const rx=70+SPD*ts;
      drawBigGuy(rx,gy,TEAM_YOU,'run',false,true);
      if(ts<impactT-0.4){
        const bob=Math.sin(ts*9)*2;
        pixelText('♪ DOODLY DOO ♪',rx+14,gy-62+bob,16,'#9fd8ff','#000',true);
        G.introTuneT=(G.introTuneT||0)-dt;
        if(G.introTuneT<=0){
          G.introTuneT=0.9; G.introTuneN=(G.introTuneN||0)+1;
          if(G.introTuneN%2===1){ voiceDoodly(); }
          else if(!(AU.on&&AU.ctx.currentTime<doodlyBlockUntil)){ // don't whistle over the man's singing
            const seq=[784,988,880,1047];
            tone(seq[G.introTuneN%4],0.14,'sine',0.09);
            tone(seq[(G.introTuneN+1)%4],0.12,'sine',0.07,null,0.18);
          }
        }
      }
      // tackler comes in FAST AS FUCK, out of nowhere — barely 0.28s of streak
      if(ts>impactT-0.28){
        const k=(ts-(impactT-0.28))/0.28;
        const mx=lerp(560,cx,k); // off-screen to contact in a blink: a blur of malice
        // motion-blur trail so the blink still reads
        for(let g=1;g<=3;g++){ const tk=Math.max(0,k-g*0.18); ctx.globalAlpha=0.18*(1-g*0.25);
          drawBigGuy(lerp(560,cx,tk),gy-6,TEAM_CPU,'missile',false,true); }
        ctx.globalAlpha=1;
        drawBigGuy(mx,gy-6,TEAM_CPU,'missile',false,true);
      }
      // he hears something...
      if(ts>impactT-0.4){
        pixelText('?!',rx+6,gy-58+Math.sin(ts*30)*2,26,'#fff200','#000',true);
        if(!G.introWarnDone){G.introWarnDone=true;tone(1400,0.09,'square',0.13);tone(1400,0.09,'square',0.13,null,0.12);}
      }
    } else if(ts<impactT+FREEZE){
      // FREEZE FRAME: the moment of contact
      if(!G.introHitDone){G.introHitDone=true;stopClip('doodly');sfx.megacrunch();sfx.boom();shake=22;} // the song dies with him
      drawBigGuy(ix,gy,TEAM_YOU,'brace',false,true);
      drawBigGuy(cx,gy-6,TEAM_CPU,'missile',false,true);
      // impact starburst between them
      ctx.fillStyle='#fff200';
      const bx=ix+16,by=gy-10;
      for(let a=0;a<10;a++){
        const an=a/10*Math.PI*2+0.3, r2=30+(a%2)*14;
        ctx.beginPath();
        ctx.moveTo(bx+Math.cos(an-0.16)*12,by+Math.sin(an-0.16)*12);
        ctx.lineTo(bx+Math.cos(an)*r2,by+Math.sin(an)*r2);
        ctx.lineTo(bx+Math.cos(an+0.16)*12,by+Math.sin(an+0.16)*12);
        ctx.fill();
      }
      pixelText('POW!!',bx,gy-78,36,'#ff5050','#000',true);
      if(ts<impactT+0.06){ ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(0,0,W,H); }
    } else {
      const ps=ts-impactT-FREEZE;
      // victim launched left in a full somersault, lands flat on his back
      const pe=Math.min(ps,0.8);
      const fx=ix-pe*237, fy=gy+4-Math.sin(Math.PI*pe/0.8)*100;
      drawBigGuy(fx,fy,TEAM_YOU,'launched',false,false,-(pe/0.8)*(Math.PI*2+1.6));
      if(ps>=0.8&&!G.introLandDone){G.introLandDone=true;sfx.thud();spawnDust(fx,fy+10);shake=6;}
      if(ps>0.75&&ps<3.7){
        pixelText('YOWZGEES!!',Math.max(fx,40)+30,fy-46+Math.sin(ps*12)*2,20,'#fff200','#000',true);
        if(!G.introYowzDone){G.introYowzDone=true;voiceYowzgees();}
      }
      // helmet pops up-and-left with gravity, same direction as the hit
      const pl=Math.min(ps,1.35);
      const hx=ix-20-pl*130, hy=gy-40-300*pl+260*pl*pl;
      ctx.save();ctx.translate(hx,hy);ctx.rotate(-pl*7);drawHelmetIcon(0,0,16,TEAM_YOU.helmet,TEAM_YOU.stripe);ctx.restore();
      // tackler follows through a step, then stands over his work
      const tx=cx-Math.min(ps,0.3)*80;
      drawBigGuy(tx,gy+(ps<0.3?-6:6),TEAM_CPU,ps<0.3?'missile':'brace',ps>=0.3,true);
      if(ps<1.2)pixelText('C-R-R-RUNCH!!',W/2,H*0.25,40,'#ff5050','#000',true);
      if(ps>1.2){
        pixelText('VERY HARD',W/2,H*0.74,52,'#fff200','#7a1010',true);
        pixelText('HITTING FOOTBALL',W/2,H*0.81,40,'#fff200','#7a1010',true);
        if(!G.introTitleDone){G.introTitleDone=true;sfx.boom();sfx.fanfare();shake=14;}
      }
      if(ps>3.9){ stopIntroMusic(); setState('title'); } // let the full YOWZGEES land before we cut
    }
  }
  pixelText('TAP TO SKIP',W/2,H-28,14,'#555',null,true);
}

/* ---------------- title ---------------- */
// chunky word rendered to its own canvas; cracked=true bakes fracture lines into the letters
function wordCanvas(word,size,fill,outline,cracked){
  const font='bold '+size+'px Impact,"Arial Black","Helvetica Neue",sans-serif';
  const m=document.createElement('canvas'); const mc=m.getContext('2d');
  mc.font=font;
  m.width=Math.ceil(mc.measureText(word).width)+28; m.height=Math.ceil(size*1.35);
  mc.font=font; mc.textAlign='center'; mc.textBaseline='middle'; mc.lineJoin='round';
  mc.lineWidth=Math.max(7,size/7); mc.strokeStyle=outline;
  mc.strokeText(word,m.width/2,m.height/2);
  mc.fillStyle=fill; mc.fillText(word,m.width/2,m.height/2);
  if(cracked){
    mc.globalCompositeOperation='source-atop'; // cracks only land on the letters
    mc.strokeStyle='rgba(45,8,8,0.9)'; mc.lineWidth=2.5; mc.lineJoin='miter';
    for(let i=0;i<11;i++){
      let x=rnd(12,m.width-12), y=rnd(4,m.height*0.3);
      mc.beginPath(); mc.moveTo(x,y);
      const segs=3+(Math.random()*4|0);
      for(let s=0;s<segs;s++){ x+=rnd(-15,15); y+=rnd(8,m.height*0.18); mc.lineTo(x,y); }
      mc.stroke();
      mc.strokeStyle='rgba(255,255,255,0.3)'; mc.lineWidth=1; // hairline glint beside the crack
      mc.beginPath(); mc.moveTo(x+2,y-6); mc.lineTo(x+rnd(-8,8),y+rnd(4,10)); mc.stroke();
      mc.strokeStyle='rgba(45,8,8,0.9)'; mc.lineWidth=2.5;
    }
    mc.globalCompositeOperation='source-over';
  }
  return m;
}
function buildTitleArt(){
  G.titleArt={
    very:wordCanvas('VERY',80,'#fff200','#7a1010',false),
    hard:wordCanvas('HARD',80,'#fff200','#7a1010',false),
    hardCracked:wordCanvas('HARD',80,'#fff200','#7a1010',true),
    hitting:wordCanvas('HITTING FOOTBALL',44,'#fff200','#7a1010',false),
  };
}
function drawWord(img,cx,cy,scale,alpha,rot){
  ctx.save(); ctx.translate(cx,cy);
  if(rot) ctx.rotate(rot);
  ctx.scale(scale,scale);
  ctx.globalAlpha=alpha;
  ctx.drawImage(img,-img.width/2,-img.height/2);
  ctx.restore(); ctx.globalAlpha=1;
}
function drawTitle(dt){
  G.titleT+=dt;
  if(!G.titleArt) buildTitleArt();
  if(G.t<0.04) G.tf={};      // fresh entry: rearm the one-shot effects
  const tf=G.tf||(G.tf={});
  const t=G.t, A=G.titleArt;
  ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
  if(!G.titleGrad){ // built once, not 60 times a second
    G.titleGrad=ctx.createRadialGradient(W/2,H*0.45,30,W/2,H*0.45,400);
    G.titleGrad.addColorStop(0,'#173a1e');G.titleGrad.addColorStop(1,'#0b0b1c');
  }
  ctx.fillStyle=G.titleGrad;ctx.fillRect(0,0,W,H);
  // frozen hit tableau
  const gy=H*0.46;
  drawBigGuy(W/2+60,gy-40,TEAM_YOU,'launched',false,false,-0.7);
  drawBigGuy(W/2-50,gy+10,TEAM_CPU,'missile',false,true);
  ctx.save();ctx.translate(W/2+150,gy-90);ctx.rotate(0.9);drawHelmetIcon(0,0,14,TEAM_YOU.helmet,TEAM_YOU.stripe);ctx.restore();
  pixelText('POW!',W/2+10,gy-90,30,'#ff5050','#000',true);
  // ---- the title assembles itself ----
  const bob=Math.sin(G.titleT*2)*4;
  const lineY=128+bob, subY=206+bob;
  const gap=14;
  const fitS=Math.min(1,(W-16)/(A.very.width+gap+A.hard.width)); // fallback fonts can run wide
  const hitS=Math.min(1,(W-16)/A.hitting.width);
  const lineW=(A.very.width+gap+A.hard.width)*fitS;
  const veryCx=W/2-lineW/2+A.very.width*fitS/2;
  const hardCxF=W/2+lineW/2-A.hard.width*fitS/2;
  const IMP=1.35, FLY=0.24;
  // HARD: slams in centered; the impact shoves it right and cracks it
  if(t>0.05){
    const k=clamp((t-0.05)/0.3,0,1);
    if(k>=1&&!tf.hardBoom){tf.hardBoom=true;sfx.boom();shake=8;}
    let hx=W/2, img=A.hard, rot=0;
    if(t>=IMP){
      img=A.hardCracked;
      const k2=clamp((t-IMP)/0.14,0,1);
      const c1=1.70158,c3=c1+1;
      const e=1+c3*Math.pow(k2-1,3)+c1*Math.pow(k2-1,2); // overshoot ease
      hx=lerp(W/2,hardCxF,e);
      if(t<IMP+0.45) rot=Math.sin((t-IMP)*40)*0.04*(1-(t-IMP)/0.45); // rattle
    }
    drawWord(img,hx,lineY,(1+(1-k)*1.4)*fitS,k,rot);
  }
  // HITTING FOOTBALL below
  if(t>0.55){
    const k=clamp((t-0.55)/0.18,0,1);
    if(k>=1&&!tf.subBoom){tf.subBoom=true;sfx.thud();shake=Math.max(shake,5);}
    drawWord(A.hitting,W/2,subY,(1+(1-k)*0.8)*hitS,k,0);
  }
  // VERY rockets in from the left and smashes into HARD
  if(t>IMP-FLY){
    if(t<IMP){
      const k=(t-(IMP-FLY))/FLY, e=k*k; // accelerating
      const vx=lerp(-A.very.width,veryCx,e);
      if(!tf.whoosh){tf.whoosh=true;noise(FLY+0.05,0.25,3500);}
      drawWord(A.very,vx-72,lineY,fitS,0.18,0); // motion ghosts
      drawWord(A.very,vx-38,lineY,fitS,0.18,0);
      drawWord(A.very,vx,lineY,(1.3-0.3*e)*fitS,1,0);
    } else {
      if(!tf.smash){
        tf.smash=true;
        sfx.megacrunch();sfx.boom();shake=18;flashWhite=0.12;
        spawnStars(veryCx+A.very.width/2+6,lineY,14);
        spawnDust(veryCx+A.very.width/2+6,lineY+12);
      }
      const rot=t<IMP+0.45?Math.sin((t-IMP)*40)*0.03*(1-(t-IMP)/0.45):0;
      drawWord(A.very,veryCx,lineY,fitS,1,rot);
    }
  }
  pixelText(TEAM_YOU.city+' '+TEAM_YOU.name,W/2,H*0.62,18,'#00e5cf',null,true);
  pixelText('VS',W/2,H*0.645,14,'#888',null,true);
  pixelText(TEAMS[0].city+' '+TEAMS[0].name,W/2,H*0.67,18,'#b06aff',null,true);
  if(t>IMP&&Math.floor(G.titleT*2)%2===0)
    pixelText('TAP TO START',W/2,H*0.78,28,'#fff','#000',true);
  const sr=seriesText();
  if(sr) pixelText(sr,W/2,H*0.845,15,'#fff200',null,true);
  pixelText('© 1994 TWO GUYS WHO COULDN’T CODE',W/2,H*0.88,14,'#777',null,true);
  pixelText('32 YEARS IN DEVELOPMENT • WORTH IT',W/2,H*0.91,14,'#777',null,true);
  drawFxWorld(0); drawFxScreen(); // impact stars / flash live on the title screen
}

function startBlitzGame(){ // BLITZ: down 7-3, 1:30, one drive, touchdown or go home
  G.suddenDeath=true;
  G.score={you:3,cpu:7}; G._ly=3; G._lc=7;

function advanceTournament(){ // you won — settle the rest of the round
  const T=G.tour, winners=[], res=[];
  for(const m of T.matches){
    if(m[0]===TEAM_YOU||m[1]===TEAM_YOU){
      winners.push(TEAM_YOU);
      res.push(TEAM_YOU.abbr+' DEF '+(m[0]===TEAM_YOU?m[1]:m[0]).abbr+'  '+G.score.you+'—'+G.score.cpu);
    } else {
      const aw=Math.random()<m[0].pow/(m[0].pow+m[1].pow);
      const w=aw?m[0]:m[1], l=aw?m[1]:m[0];
      const ws=pick([17,20,21,24,27,28,31,34]);
      res.push(w.abbr+' DEF '+l.abbr+'  '+ws+'—'+Math.max(0,ws-pick([3,4,7,10,14,17,21])));
      winners.push(w);
    }
  }
  T.lastResults=res;
  if(T.round===2){ setState('champion'); sfx.td(); sfx.cheer(); sfx.crowd(); return; }
  T.round++;
  T.matches=[]; for(let i=0;i<winners.length;i+=2) T.matches.push([winners[i],winners[i+1]]);
  setState('bracket');
}

// patch original onButton to handle playcall ids defined later
const _origOnButton=onButton;
onButton=function(id){
  if(!id) return;
  if(G.state==='defense'){
    if(G.def&&G.def.phase==='rep'){
      if(id==='d_wrap') resolveTackle('wrap');
      if(id==='d_hit') resolveTackle('hit');
    }
    return;
  }
  if(G.state==='mode'){
    sfx.ui();

    if(id==='mode_tourney'){ startTournament(false); }
    if(id==='mode_blitz'){ startTournament(true); }
    return;
  }
  if(G.state==='playcall'){
    sfx.ui();

      queueBanner(['DIRK THUNDER TAKES A KNEE','THE MOST DISRESPECTFUL PLAY IN SPORTS','GOOD NIGHT, '+TEAM_CPU.city],
        ()=>{ G.clock=0; G.clockRunning=false; handleClockExpiry(); });
      return;
    }
    if(id==='play_to'){
      if(G.timeouts>0&&G.clockRunning){
        G.timeouts--; G.clockRunning=false;
        sfx.whistle(); bigText('TIMEOUT!',{size:30,color:'#9fd8ff',dur:1.0});
        buttons=[]; // rebuild without the timeout option
      }

    }
    if(id==='kick_deep'){ G.kickChoice=false; endOfYourDrive(); return; }
    if(id==='kick_onside'){ G.kickChoice=false; resolveOnside(); return; }
    if(id==='play_xp'){ G.convChoice=false; startKickMeter('xp'); return; }

      G.losYd=2; G.down=1; G.toGo=2; G.firstYd=0;

let last=performance.now();
let lastDraw=0;
function frame(now){
  requestAnimationFrame(frame);
  // cap at ~60fps: 120Hz phones were doing double work for a pixel game,
  // which is how pockets catch fire
  if(now-lastDraw<14) return;
  lastDraw=now;
  const raw=Math.min(0.05,(now-last)/1000); last=now;
  let dt=raw;
  G.t+=raw;
  // consume taps
  let tapped=taps.length>0; taps.length=0;

  if(hitstop>0){ hitstop-=raw; dt=0; } // freeze gameplay during a VERY HARD HIT
  updateFx(raw);                       // fx, shake and shouts always tick
  // a running clock runs BETWEEN plays too — through the spot, the huddle, your indecision
  if(!G.convChoice&&!G.kickChoice){
    if(G.state==='dead'&&G.deadOpts&&G.deadOpts.runoff&&G.clock>0)
      G.clock=Math.max(0,G.clock-raw);
    else if(G.clockRunning&&(G.state==='playcall'||G.state==='snap')){
      G.clock=Math.max(0,G.clock-raw);
      if(G.clock<=0&&G.state==='playcall'){ G.clockRunning=false; handleClockExpiry(); }
    }
  }

  ctx.save();
  if(shake>0) ctx.translate(rnd(-shake,shake)*0.5,rnd(-shake,shake)*0.5);
  if(zoomPunch>0){ // punch-zoom: the camera flinches with the hit
    const z=1+zoomPunch;
    ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-W/2,-H/2);
  }

  switch(G.state){
    case 'boot':
      // tap gate: browsers refuse to play audio until a user gesture,
      // and the intro deserves its score
      if(!fieldCv) buildField();       // pre-bake the heavy art while the player
      if(!G.titleArt) buildTitleArt(); // reads the boot screen — no mid-game hitch
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
      pixelText('TOTAL NOG PRODUCTIONS',W/2,H*0.42,22,'#888',null,true);
      pixelText('PRESENTS',W/2,H*0.47,16,'#555',null,true);
      if(Math.floor(G.t*2)%2===0)pixelText('TAP TO BEGIN',W/2,H*0.62,26,'#fff200','#000',true);
      pixelText('SOUND ON. TRUST US.',W/2,H*0.68,14,'#666',null,true);
      if(tapped){ startIntroMusic(); setState('intro'); }
      break;
    case 'intro':
      if(G.introMusicWanted) realStartIntroMusic(G.introT); // late unlock: join the score in progress
      drawIntro(dt);
      if(tapped&&G.introT>0.5){ stopIntroMusic(); setState('title'); }
      break;
    case 'title':
      drawTitle(dt);
      if(tapped&&G.t>0.4) advanceTap();

    case 'howto':
      drawHowTo();

      if(buttons.length===0) setupPlaycallButtons();

    case 'snap': {

      drawField(G.camY);
      for(const p of G.players) drawPlayer(p,G.camY);
      // the football: on the ground at center, then snapped back to the QB
      const k=G.snapHiking?Math.min(b.t/0.2,1):0;
      const by=lerp(b.y0,b.y1,k)-Math.sin(k*Math.PI)*9; // a little arc on the way back
      ctx.save(); ctx.translate(b.x,by-G.camY); ctx.rotate(G.snapHiking?b.t*42:0);
      ctx.fillStyle='#8a4b1f'; ctx.fillRect(-4,-3,8,6); ctx.fillStyle='#fff'; ctx.fillRect(-1,-3,2,6);
      ctx.restore();

        if(Math.floor(G.t*3)%2===0) pixelText('TAP TO HIKE',W/2,H*0.86,28,'#fff200','#000',true);
        if(tapped) hikeBall();
      }

      if(dt>0&&G.playLive) updateLive(dt);

        }
        const k=Math.min((a.t-RUN)/1.0,1.0);
        // lateral drift: inside the posts, off the post, or wide — per your tap
        const spread=isPunt?(10+a.offCenter*50)
                    :a.good?(a.offCenter/Math.max(a.window,0.01))*80
                    :(a.doink?106:135+Math.min(85,(a.offCenter-a.window)*220));
        let bx,by,scale,rot=(a.t-RUN)*12;
        if(a.blocked){ // it never had a chance
          if(a.t<RUN+0.10){ const bk=(a.t-RUN)/0.10; bx=lerp(teeX,241,bk); by=lerp(teeY-14,545,bk); scale=1-0.1*bk; }
          else {
            if(!a.resolved){ a.resolved=true; a.resolvedAt=a.t;
              sfx.megacrunch(); shake=12; zoomPunch=0.07;
              bigText('BLOCKED!!',{size:40,color:'#ff5050',dur:1.4});
            }
            const pb=a.t-RUN-0.10;
            bx=241-260*pb; by=545+200*pb-(pb>0.47?0:0); rot=(a.t-RUN)*22; scale=0.9;
            if(by>640){ by=640-(by-640)*0.45; } // one sad bounce
          }
        } else {
          bx=lerp(teeX,240+a.side*spread,k);
          by=isPunt? teeY-14-620*k+90*k*k : teeY-14-500*k+150*k*k;
          scale=1-0.55*k;
          if(a.doink&&k>=1){ // CLANG. the post wins.
            const pb=a.t-RUN-1.0;
            bx=240+a.side*106; by=236+pb*260; scale=0.45+pb*0.15;
          } else if(k>=1){
            const pb=a.t-RUN-1.0;
            if(a.good&&!isPunt){ // it drops into the net, where good kicks live
              bx=240+a.side*spread; by=Math.min(380,236+pb*220); scale=0.45;
              a.netWobbleT=Math.max(0.01,0.7-pb);
            } else {
              bx+=a.side*(a.good?8:46)*pb;
              by=(isPunt?56:236)-pb*(isPunt?220:36);
              scale=Math.max(0.22,0.45-pb*0.1);
            }
          }
        }
        ctx.save(); ctx.translate(bx,by); ctx.rotate(rot); ctx.scale(scale,scale);
        ctx.fillStyle='#8a4b1f'; ctx.fillRect(-7,-5,14,10);
        ctx.fillStyle='#fff'; ctx.fillRect(-1.5,-5,3,10);
        ctx.restore();
        if(!a.blocked&&k>=1&&!a.resolved){
          a.resolved=true; a.resolvedAt=a.t;
          if(isPunt){ if(a.offCenter<0.25) bigText('MOONSHOT.',{size:28,color:'#9fd8ff',dur:1.0}); }
          else if(a.good){ sfx.td(); sfx.cheer(); flashWhite=0.08; spawnStars(bx,by,10);
            for(let i=0;i<20;i++) parts.push({kind:'bulb',x:Math.random()*W,y:rnd(60,300),t:0,dur:0.9,blinkAt:rnd(0,0.6)});
            noise(1.4,0.35,1800,0.35); // the second wave of the eruption
            bigText('IT’S GOOD!',{size:40,color:'#7dff6a',dur:1.3}); }
          else if(a.doink){ tone(420,0.5,'square',0.3,250); tone(630,0.3,'square',0.15,380); shake=10;
            bigText('DOINK!!',{size:38,color:'#ff9f50',dur:1.3}); }
          else { sfx.fail();
            parts.push({kind:'bulb',x:rnd(0,W),y:rnd(60,300),t:0,dur:0.5,blinkAt:0.1}); // the lone away fan
            bigText(a.side<0?'WIDE LEFT!':'WIDE RIGHT!',{size:34,color:'#ff5050',dur:1.3}); }
        }
      }
      if(!isPunt){ // the officials, tracking it the whole way
        const pose=!a.resolved?'idle':(a.good?'good':'no');
        drawRef(108,545,2.2,pose,a.t);
        drawRef(372,545,2.2,pose,a.t);
      }
      drawHUD(); drawFxWorld(0); drawFxScreen();
      if(a.t>RUN+(isPunt?1.5:(a.blocked?2.2:2.6))) finishKick();
      break; }
    case 'lineup': { // meet your idiots
      const L2=G.lineup; L2.t+=dt;
      const idx=Math.min(L2.cards.length-1,Math.floor(L2.t/0.75));
      const who=L2.cards[idx];
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      pixelText('YOUR 1994 '+TEAM_YOU.city+' '+TEAM_YOU.name,W/2,90,20,'#00e5cf','#000',true);
      pixelText('STARTING LINEUP',W/2,120,16,'#888',null,true);
      if(idx!==L2.lastIdx){ L2.lastIdx=idx; tone(523+idx*60,0.12,'square',0.1); }
      drawBigGuy(W/2,H*0.38,TEAM_YOU,'run',false,true);
      pixelText('#'+who.num+' '+who.name,W/2,H*0.50,28,'#fff200','#000',true);
      pixelText(who.pos,W/2,H*0.545,18,'#fff',null,true);
      pixelText(who.bio,W/2,H*0.61,14,'#9fd8ff',null,true);
      pixelText('TAP TO SKIP',W/2,H*0.9,14,'#555',null,true);
      if(tapped||L2.t>L2.cards.length*0.75+0.3){ const nx=L2.next; G.lineup=null; nx(); }
      break; }
    case 'mode': {
      if(buttons.length===0){
        buttons.push({id:'mode_quick',rect:true,x:40,y:H*0.40,w:W-80,h:88,label:'QUICK GAME',sub:'THE CLASSIC GRUDGE: VS THE '+TEAMS[0].name});
        buttons.push({id:'mode_tourney',rect:true,x:40,y:H*0.40+104,w:W-80,h:88,label:'TOURNAMENT',sub:'THE 1994 INVITATIONAL: 8 TEAMS, 1 CROWN'});
        buttons.push({id:'mode_blitz',rect:true,x:40,y:H*0.40+208,w:W-80,h:88,label:'BLITZ TOURNAMENT',sub:'SUDDEN DEATH. DOWN 7–3. TD OR GO HOME.'});
      }
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      pixelText('SELECT MODE',W/2,H*0.22,30,'#fff200','#000',true);
      drawButtons();
      break; }
    case 'bracket': {
      const T=G.tour;
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      pixelText('THE VHH INVITATIONAL',W/2,70,26,'#fff200','#000',true);
      pixelText(ROUND_NAMES[T.round],W/2,108,22,'#fff','#000',true);
      if(T.accel) pixelText('BLITZ FORMAT: ONE DRIVE. TD OR GO HOME.',W/2,134,14,'#ff8080',null,true);
      let y=170;
      for(const m of T.matches){
        const mine=m[0]===TEAM_YOU||m[1]===TEAM_YOU;
        if(mine){ ctx.strokeStyle='#fff200'; ctx.lineWidth=3; ctx.strokeRect(60,y-24,W-120,82); }
        [m[0],m[1]].forEach((t2,i)=>{
          ctx.fillStyle=t2.jersey; ctx.fillRect(86,y-12+i*36,18,18);
          pixelText(t2.city+' '+t2.name,116,y-3+i*36,17,t2===TEAM_YOU?'#00e5cf':'#ddd',null,false);
        });
        pixelText(mine?'YOU':'SIM',W-86,y+15,14,mine?'#fff200':'#666',null,true);
        y+=104;
      }
      if(T.lastResults){
        pixelText('LAST ROUND:',W/2,y+6,15,'#888',null,true);
        T.lastResults.forEach((r,i)=>pixelText(r,W/2,y+28+i*20,14,'#aaa',null,true));
        y+=28+T.lastResults.length*20+14;
      }
      { // the Invitational stat sheet so far
        const ts=T.stats||{}, tv=(n,k)=>(ts[n]&&ts[n][k])||0;
        const D='DIRK THUNDER', R='REX HAMBONE';
        if(ts[D]||ts[R]){
          pixelText('INVITATIONAL TOTALS:',W/2,y+6,15,'#888',null,true);
          pixelText('THUNDER: '+tv(D,'comp')+'/'+tv(D,'att')+', '+tv(D,'passYds')+' YDS, '+tv(D,'passTD')+' TD'
            +(tv(D,'int')?', '+tv(D,'int')+' INT':''),W/2,y+27,14,'#00e5cf',null,true);
          pixelText('HAMBONE: '+tv(R,'rushYds')+' RUSH YDS, '+tv(R,'rushTD')+' TD, '+tv(R,'vhh')+' VHH',
            W/2,y+46,14,'#00e5cf',null,true);
        }
      }
      if(Math.floor(G.t*2)%2===0)
        pixelText('TAP TO PLAY YOUR GAME',W/2,H*0.92,22,'#fff','#000',true);
      if(tapped&&G.t>0.4) startTourGame();
      break; }
    case 'champion': {
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      for(let i=0;i<4;i++){
        const fx=(i*120+60+Math.sin(G.t*2+i*2)*30);
        spawnLite(fx,140+((G.t*150+i*180)%420));
      }
      // the trophy
      const tx=W/2,ty=H*0.36;
      ctx.fillStyle='#ffd700';
      ctx.fillRect(tx-34,ty-50,68,14);                  // rim
      ctx.beginPath();ctx.moveTo(tx-34,ty-36);ctx.lineTo(tx+34,ty-36);ctx.lineTo(tx+14,ty+8);ctx.lineTo(tx-14,ty+8);ctx.fill(); // bowl
      ctx.fillRect(tx-5,ty+8,10,26);                    // stem
      ctx.fillRect(tx-26,ty+34,52,10);                  // base
      ctx.strokeStyle='#ffd700';ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(tx-40,ty-22,16,Math.PI*0.5,Math.PI*1.5);ctx.stroke(); // handles
      ctx.beginPath();ctx.arc(tx+40,ty-22,16,-Math.PI*0.5,Math.PI*0.5);ctx.stroke();
      pixelText('CHAMPIONS',W/2,H*0.55,44,'#fff200','#7a1010',true);
      pixelText('OF THE 1994 VHH INVITATIONAL',W/2,H*0.60,18,'#fff',null,true);
      { // tournament run, etched on the trophy
        const ts=(G.tour&&G.tour.stats)||{}, tv=(n,k)=>(ts[n]&&ts[n][k])||0;
        pixelText('THUNDER: '+tv('DIRK THUNDER','passYds')+' YDS, '+tv('DIRK THUNDER','passTD')+' TD'
          +'  •  HAMBONE: '+tv('REX HAMBONE','rushYds')+' YDS, '+tv('REX HAMBONE','rushTD')+' TD',
          W/2,H*0.655,14,'#00e5cf',null,true);
        let vhh=0; for(const n in ts) vhh+=ts[n].vhh||0;
        pixelText('VERY HARD HITS THIS TOURNAMENT: '+vhh,W/2,H*0.69,14,'#7dff6a',null,true);
      }
      const sr2=seriesText();
      if(sr2) pixelText(sr2,W/2,H*0.75,15,'#fff200',null,true);
      pixelText('TEXT HIM. TEXT HIM RIGHT NOW.',W/2,H*0.81,18,'#fff200','#000',true);
      if(Math.floor(G.t*2)%2===0)pixelText('TAP TO RETURN',W/2,H*0.89,18,'#fff','#000',true);
      drawFxScreen2();
      if(tapped&&G.t>1.0){ G.tour=null; setState('title'); }
      break; }
    case 'gameover': {
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      const win=G.result==='win';
      if(win){
        for(let i=0;i<3;i++){
          const fx=(i*160+80+Math.sin(G.t*2+i*2)*30), fy=120+((G.t*120+i*200)%500);
          spawnLite(fx,600-fy+120);
        }
      }
      pixelText(win?TEAM_YOU.name:TEAM_CPU.name,W/2,H*0.18,40,win?'#00e5cf':TEAM_CPU.stripe,'#000',true);
      pixelText(G.ot?'WIN IN OT!':'WIN!',W/2,H*0.24,48,'#fff200','#000',true);
      pixelText('FINAL: '+TEAM_YOU.abbr+' '+G.score.you+' — '+TEAM_CPU.abbr+' '+G.score.cpu,W/2,H*0.34,24,'#fff',null,true);
      if(!win&&G.ot)
        pixelText('SUDDEN DEATH. YOU HAD YOUR CHANCE.',W/2,H*0.385,14,'#999',null,true);
      const sr=seriesText();
      if(sr) pixelText(sr,W/2,H*0.59,17,'#fff200',null,true);
      pixelText('VERY HARD HITS DELIVERED: '+G.vhhCount,W/2,H*0.44,20,'#7dff6a',null,true);
      pixelText('VERY HARD HITS RECEIVED: '+G.vhhTaken,W/2,H*0.49,20,'#ff8080',null,true);
      pixelText('LONGEST PLAY: '+G.longestPlay+' YDS',W/2,H*0.54,20,'#9fd8ff',null,true);
      if(G.ffCount) pixelText('FUMBLES FORCED: '+G.ffCount,W/2,H*0.585,18,'#7dff6a',null,true);
      pixelText(win?'TEXT YOUR FRIEND. TALK TRASH.':'REMATCH. IMMEDIATELY.',W/2,H*0.66,22,'#fff200','#000',true);
      if(G.tour) pixelText(win?ROUND_NAMES[G.tour.round]+' — SURVIVED':'ELIMINATED FROM THE INVITATIONAL',
        W/2,H*0.715,16,win?'#7dff6a':'#ff8080',null,true);
      if(Math.floor(G.t*2)%2===0)
        pixelText('TAP FOR THE BOX SCORE',W/2,H*0.78,24,'#fff','#000',true);
      pixelText('EST. 1994 • SHIPPED 2026',W/2,H*0.9,14,'#777',null,true);
      drawFxScreen2();
      if(tapped&&G.t>1.0) setState('boxscore');
      break; }
    case 'boxscore': {
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      pixelText('BOX SCORE',W/2,64,30,'#fff200','#000',true);
      pixelText(TEAM_YOU.abbr+' '+G.score.you+' — '+TEAM_CPU.abbr+' '+G.score.cpu,W/2,98,18,'#aaa',null,true);
      const gs=G.gstats||{}, car=loadCareers();
      const v=(s,k)=>(s&&s[k])||0;
      let y=150;
      const row=(who,line,careerLine)=>{
        pixelText('#'+who.num+' '+who.name,40,y,18,'#00e5cf',null,false);
        pixelText(line,40,y+22,16,'#fff',null,false);
        if(careerLine) pixelText(careerLine,40,y+41,12,'#777',null,false);
        y+=72;
      };
      const q=gs[ROSTER.QB.name], cq=car[ROSTER.QB.name];
      row(ROSTER.QB,
        v(q,'comp')+'/'+v(q,'att')+', '+v(q,'passYds')+' YDS, '+v(q,'passTD')+' TD'
          +(v(q,'int')?', '+v(q,'int')+' INT':'')+(v(q,'rushYds')?'  •  '+v(q,'rushYds')+' RUSH':''),
        cq?('CAREER: '+(cq.passYds||0)+' YDS, '+(cq.passTD||0)+' TD, '+(cq.games||0)+' GAMES'):null);
      const r2=gs[ROSTER.RB.name], cr=car[ROSTER.RB.name];
      row(ROSTER.RB,
        v(r2,'rushYds')+' RUSH YDS, '+v(r2,'rushTD')+' TD'
          +(v(r2,'rec')?'  •  '+v(r2,'rec')+' REC '+v(r2,'recYds')+' YDS':'')
          +(v(r2,'vhh')?'  •  '+v(r2,'vhh')+' VHH':''),
        cr?('CAREER: '+(cr.rushYds||0)+' RUSH YDS, '+(cr.rushTD||0)+' TD'):null);
      const ch=gs[ROSTER.RB2.name];
      if(ch) row(ROSTER.RB2,
        v(ch,'rushYds')+' RUSH YDS, '+v(ch,'rushTD')+' TD (FILLED IN ADMIRABLY)',null);
      for(const key of ['WRA','WRB']){
        const w2=gs[ROSTER[key].name], cw=car[ROSTER[key].name];
        row(ROSTER[key],
          v(w2,'rec')+' REC, '+v(w2,'recYds')+' YDS, '+v(w2,'recTD')+' TD',
          cw?('CAREER: '+(cw.recYds||0)+' REC YDS, '+(cw.recTD||0)+' TD'):null);
      }
      const rt=gs[ROSTER.RET.name];
      if(v(rt,'retYds')||v(rt,'retTD'))
        row(ROSTER.RET,v(rt,'retYds')+' RETURN YDS'+(v(rt,'retTD')?', '+v(rt,'retTD')+' TD':''),null);
      const kk2=gs[ROSTER.K.name];
      if(v(kk2,'fga')||v(kk2,'xpa'))
        row(ROSTER.K,v(kk2,'fgm')+'/'+v(kk2,'fga')+' FG, '+v(kk2,'xpm')+'/'+v(kk2,'xpa')+' XP',null);
      if(Math.floor(G.t*2)%2===0)
        pixelText(G.tour?(G.result==='win'?'TAP FOR THE BRACKET':'TAP. GO HOME.'):'TAP FOR REMATCH',W/2,H*0.93,20,'#fff','#000',true);
      if(tapped&&G.t>0.4){
        if(G.tour){
          if(G.result==='win') advanceTournament();
          else { G.tour=null; setState('title'); }
        } else setState('title');
      }
      break; }
  }
  ctx.restore();
  // watchdog: iOS can leave the context suspended/interrupted — keep nudging it
  if(AU.on&&frameCount%30===0&&AU.ctx.state!=='running'){ try{AU.ctx.resume();}catch(e){} }
  if(DEBUG){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H-46,W,46);
    const ss=window.speechSynthesis;
    pixelText('au:'+(AU.on?AU.ctx.state:'off')+' tts:'+ttsDebug,8,H-32,13,'#7dff6a',null,false);
    pixelText(ss?('v:'+ss.getVoices().length+' spk:'+ss.speaking+' pen:'+ss.pending+' pau:'+ss.paused):'no-tts',8,H-13,13,'#7dff6a',null,false);
  }
  frameCount++;
}
let frameCount=0;
const liteParts=[];
function spawnLite(x,y){
  if(Math.random()<0.15)liteParts.push({x,y,t:0,c:pick(['#fff200','#00e5cf','#b06aff','#ff5050'])});
}
function drawFxScreen2(){
  for(let i=liteParts.length-1;i>=0;i--){
    const p=liteParts[i];p.t+=0.016;
    ctx.fillStyle=p.c;
    for(let a=0;a<6;a++){
      const an=a/6*Math.PI*2+p.t*3;
      ctx.fillRect(p.x+Math.cos(an)*p.t*120,p.y+Math.sin(an)*p.t*120,4,4);
    }
    if(p.t>0.7)liteParts.splice(i,1);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>

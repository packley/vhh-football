<title>VERY HARD HITTING FOOTBALL</title>
<style>
  html,body{margin:0;padding:0;background:#0b0b12;height:100%;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0b12;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;}

<div id="wrap"><canvas id="cv" width="480" height="800"></canvas></div>
<script>
'use strict';
/* =====================================================================
   VERY HARD HITTING FOOTBALL
   Conceived 1994 (cover art only). Finally playable.
   One file. Maximum carnage.
   ===================================================================== */

const W=480, H=800;
const DEBUG=typeof location!=='undefined'&&/[?&]debug/.test(location.search);
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

function fitCanvas(){
  const ww=window.innerWidth, wh=window.innerHeight;
  const s=Math.min(ww/W, wh/H);
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
window.addEventListener('resize',fitCanvas); fitCanvas();

/* ---------------- helpers ---------------- */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];

/* ---------------- field geometry ---------------- */
const PPY=14;                 // pixels per yard (vertical)
const FX0=20, FX1=460;        // field side lines (px)
const EZ=10*PPY;              // endzone depth px
// world y: 0 = goal line you are attacking (top). 100yd line = your own goal.
const yd2y=yd=>yd*PPY;
const y2yd=y=>y/PPY;

/* ---------------- teams ---------------- */
const TEAM_YOU={city:'SMASHVILLE',name:'SKULLCRUSHERS',abbr:'SKL',
  jersey:'#00b8a6',jersey2:'#007d72',helmet:'#101418',stripe:'#00e5cf',skin:'#e8b88a'};
const TEAM_CPU={city:'BONE COUNTY',name:'BRUISERS',abbr:'BRU',
  jersey:'#7a2fbf',jersey2:'#54208a',helmet:'#ff7a00',stripe:'#ffffff',skin:'#c98c5f'};

/* ---------------- audio (all synthesized) ---------------- */
const AU={ctx:null,master:null,on:false};
function audioInit(){
  if(AU.on) return;
  try{
    AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
    AU.master=AU.ctx.createGain(); AU.master.gain.value=0.5;
    // compressor keeps stacked carnage from clipping into mush on phone speakers
    let out=AU.ctx.destination;
    try{
      const comp=AU.ctx.createDynamicsCompressor();
      comp.threshold.value=-18; comp.knee.value=20; comp.ratio.value=6;
      comp.connect(AU.ctx.destination); out=comp;
    }catch(e){}
    AU.master.connect(out);
    // one shared noise bed; every noise() call plays a random slice of it
    AU.noiseBuf=AU.ctx.createBuffer(1,AU.ctx.sampleRate*2,AU.ctx.sampleRate);
    const nd=AU.noiseBuf.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    AU.on=true;
  }catch(e){}
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){} // play through the iPhone mute switch
  try{ if(window.speechSynthesis) speechSynthesis.getVoices(); }catch(e){} // warm the TTS voice list
  setTimeout(decodeClips,0); // keep the 150KB base64 decode off the gesture-critical path
}
// iOS: audio must be unlocked INSIDE a touch handler — resume + play a silent buffer
function unlockAudio(){
  if(!AU.on) return;
  if(AU.ctx.state!=='running'){
    try{ AU.ctx.resume(); }catch(e){}
    try{
      const b=AU.ctx.createBuffer(1,1,22050), s=AU.ctx.createBufferSource();
      s.buffer=b; s.connect(AU.ctx.destination); s.start(0);
    }catch(e){}
  }
}
// iOS: the first speechSynthesis.speak must also come from a gesture — prime it silently
let ttsUnlocked=false, ttsPrimer=null;
function unlockTTS(){
  if(ttsUnlocked||!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
  try{
    // a real (just barely audible) word — iOS ignores whitespace/zero-volume primers
    ttsPrimer=new SpeechSynthesisUtterance('hut'); ttsPrimer.volume=0.02; ttsPrimer.rate=2;
    ttsPrimer.onstart=()=>{ ttsProven=true; ttsDebug='primer ok'; };
    speechSynthesis.speak(ttsPrimer); ttsUnlocked=true;
  }catch(e){}
}
function tone(freq,dur,type,vol,slideTo,when){
  if(!AU.on) return;
  const t0=AU.ctx.currentTime+(when||0);
  const o=AU.ctx.createOscillator(), g=AU.ctx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
  g.gain.setValueAtTime(vol||0.15,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(AU.master); o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur,vol,filterFreq,when){
  if(!AU.on||!AU.noiseBuf) return;
  const t0=AU.ctx.currentTime+(when||0);
  const src=AU.ctx.createBufferSource(); src.buffer=AU.noiseBuf;
  const f=AU.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filterFreq||900;
  const g=AU.ctx.createGain(); g.gain.setValueAtTime(vol||0.3,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  src.connect(f); f.connect(g); g.connect(AU.master);
  src.start(t0,Math.random()*(2-Math.min(dur,1.9)),dur);
}
const sfx={
  crunch(){ const v=rnd(0.85,1.15),fq=rnd(0.8,1.25); noise(0.22,0.9,700*fq); tone(150*v,0.28,'sine',0.5,38*v); tone(90*v,0.18,'square',0.25,30); },
  megacrunch(){ const v=rnd(0.85,1.15),fq=rnd(0.8,1.25); noise(0.3,1.0,600*fq); noise(0.4,0.5,300*fq,0.05); tone(170*v,0.4,'sine',0.6,30); tone(60*v,0.35,'sawtooth',0.3,24); },
  thud(){ noise(0.1,0.35,500); tone(110,0.12,'sine',0.3,60); },
  whistle(){ tone(2300,0.35,'square',0.07); tone(2800,0.35,'square',0.05); },
  hike(){ tone(220,0.08,'square',0.12); tone(180,0.08,'square',0.12,null,0.1); },
  throwFx(){ noise(0.18,0.12,3500); },
  catchFx(){ noise(0.07,0.25,1200); tone(500,0.06,'square',0.1); },
  td(){ [392,523,659,784,1046].forEach((f,i)=>tone(f,0.22,'square',0.14,null,i*0.11)); noise(1.2,0.18,1800,0.1); },
  firstDown(){ tone(523,0.1,'square',0.12); tone(659,0.14,'square',0.12,null,0.1); },
  fail(){ tone(300,0.25,'sawtooth',0.14,150); tone(150,0.35,'sawtooth',0.12,80,0.2); },
  pick(){ tone(700,0.1,'square',0.14,200); tone(120,0.4,'sawtooth',0.16,60,0.1); },
  ui(){ tone(880,0.05,'square',0.08); },
  jingle(){ [262,330,392,330,392,523].forEach((f,i)=>tone(f,0.16,'square',0.12,null,i*0.13)); },
  boom(){ tone(80,0.5,'sine',0.7,25); noise(0.5,0.6,250); },
  crowd(){ noise(1.4,0.22,2200); },
  cheer(){ // the home crowd loses it
    noise(2.6,0.55,1400); noise(2.2,0.35,3200,0.15); noise(1.6,0.25,800,0.4);
    [1200,1500,1800].forEach((f,i)=>tone(f,0.3,'sine',0.05,null,0.3+i*0.4));
  },
  fanfare(){ [392,494,587,784].forEach((f,i)=>tone(f,0.3,'sawtooth',0.09,null,i*0.09)); tone(784,0.7,'sawtooth',0.1,null,0.36); },
};

/* ---- gravelly retro voice (formant synthesis) ---- */
function say(sylls,vol){
  if(!AU.on) return;
  const t0=AU.ctx.currentTime+0.02;
  const bus=AU.ctx.createGain(); bus.gain.value=vol||0.6; bus.connect(AU.master);
  // gravel: chop the amplitude at vocal-fry rate
  const chop=AU.ctx.createGain(); chop.gain.value=0.65;
  const lfo=AU.ctx.createOscillator(); lfo.type='square'; lfo.frequency.value=52;
  const lfoG=AU.ctx.createGain(); lfoG.gain.value=0.35;
  lfo.connect(lfoG); lfoG.connect(chop.gain);
  // scratchy: overdrive the raw waveform
  const sh=AU.ctx.createWaveShaper();
  const curve=new Float32Array(256);
  for(let i=0;i<256;i++){ const x=i/128-1; curve[i]=Math.tanh(3.5*x); }
  sh.curve=curve;
  const osc=AU.ctx.createOscillator(); osc.type='sawtooth';
  const f1=AU.ctx.createBiquadFilter(); f1.type='bandpass'; f1.Q.value=9;
  const f2=AU.ctx.createBiquadFilter(); f2.type='bandpass'; f2.Q.value=11;
  const f2g=AU.ctx.createGain(); f2g.gain.value=0.7;
  const env=AU.ctx.createGain(); env.gain.value=0.0001;
  osc.connect(sh); sh.connect(f1); sh.connect(f2);
  f1.connect(env); f2.connect(f2g); f2g.connect(env);
  env.connect(chop); chop.connect(bus);
  let tt=t0;
  for(const s of sylls){
    osc.frequency.setValueAtTime(s.f0[0],tt);
    osc.frequency.exponentialRampToValueAtTime(s.f0[1],tt+s.dur);
    f1.frequency.setValueAtTime(s.F[0][0],tt);
    f1.frequency.exponentialRampToValueAtTime(s.F[0][1],tt+s.dur);
    f2.frequency.setValueAtTime(s.F[1][0],tt);
    f2.frequency.exponentialRampToValueAtTime(s.F[1][1],tt+s.dur);
    env.gain.setValueAtTime(0.0001,tt);
    env.gain.exponentialRampToValueAtTime(1.2,tt+0.03);
    env.gain.setValueAtTime(1.2,tt+Math.max(0.04,s.dur-0.04));
    env.gain.exponentialRampToValueAtTime(0.0001,tt+s.dur);
    tt+=s.dur+(s.pause||0.03);
  }
  lfo.start(t0); osc.start(t0); osc.stop(tt+0.05); lfo.stop(tt+0.05);
}
// old-radio crackle bed to dirty up the spoken voice
function crackle(dur){
  if(!AU.on) return;
  for(let i=0;i<dur*26;i++) noise(0.015,0.05,4500,Math.random()*dur);
  noise(dur,0.035,1600,0);
}

const clipBufs={};
let doodlyBlockUntil=0;
function decodeClips(){
  if(!AU.on) return;
  for(const k in VOICE_CLIPS){
    if(clipBufs[k]!==undefined||VOICE_CLIPS[k].indexOf('%%')===0) continue;
    clipBufs[k]=null; // decoding in flight
    try{
      const bin=atob(VOICE_CLIPS[k]);
      const arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      AU.ctx.decodeAudioData(arr.buffer,b=>{clipBufs[k]=b;},()=>{clipBufs[k]=false;});
    }catch(e){ clipBufs[k]=false; }
  }
}
function playClip(k,vol){
  if(!AU.on||!clipBufs[k]) return false;
  const s=AU.ctx.createBufferSource(); s.buffer=clipBufs[k];
  const g=AU.ctx.createGain(); g.gain.value=vol||0.9;
  s.connect(g); g.connect(AU.master); s.start();
  return true;
}
const uttKeep=[]; // Safari GCs un-referenced utterances before they play — keep them alive
let ttsProven=false, ttsDebug='no speak yet';
function speak(segs,opts,fallback){
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){ if(fallback)fallback(); return; }
    if(typeof segs==='string') segs=[{text:segs}];
    const vs=speechSynthesis.getVoices();
    const us=v=>/en[-_]US/i.test(v.lang);
    const pref=vs.find(v=>us(v)&&/fred|alex|aaron|reed|rocko|eddy|male/i.test(v.name))
             ||vs.find(us)
             ||vs.find(v=>/^en/i.test(v.lang));
    // NOTE: no cancel() here — Safari drops an utterance spoken right after cancel()
    try{ speechSynthesis.resume(); }catch(e){}
    let started=false;
    segs.forEach((s,si)=>{
      const u=new SpeechSynthesisUtterance(s.text);
      u.pitch=s.pitch!==undefined?s.pitch:(opts.pitch!==undefined?opts.pitch:0.8);
      u.rate=s.rate||opts.rate||0.85;
      u.volume=s.volume!==undefined?s.volume:1;
      if(pref)u.voice=pref;
      if(si===0) u.onstart=()=>{ started=true; ttsProven=true; ttsDebug='spoke ok'; };
      uttKeep.push(u); if(uttKeep.length>10) uttKeep.shift();
      u.onend=u.onerror=ev=>{
        if(ev&&ev.type==='error') ttsDebug='err:'+(ev.error||'?');
        const i=uttKeep.indexOf(u); if(i>=0) uttKeep.splice(i,1);
      };
      speechSynthesis.speak(u);
    });
    ttsDebug='queued v:'+vs.length;
    crackle(opts.dur||0.9);
    // watchdog: if the engine never actually starts within 450ms, use the robot voice
    if(fallback) setTimeout(()=>{
      if(!started&&!ttsProven){
        ttsDebug='timeout->robot';
        try{ speechSynthesis.cancel(); }catch(e){}
        fallback();
      }
    },900);
  }catch(e){ ttsDebug='throw'; if(fallback)fallback(); }
}
// vowel formants: oo[320,800] ih[420,1800] ee[290,2200] ow glide[650->320,1150->800]
function voiceDoodly(){
  if(AU.on&&clipBufs.doodly){
    if(AU.ctx.currentTime<doodlyBlockUntil) return; // clip still playing
    doodlyBlockUntil=AU.ctx.currentTime+clipBufs.doodly.duration;
    playClip('doodly',0.85); return;
  }
  speak('doodly doo!',{pitch:0.85,rate:0.9,dur:0.8},()=>say([
    {dur:0.16,f0:[95,120], F:[[320,330],[800,830]]},
    {dur:0.08,f0:[120,112],F:[[420,400],[1800,1600]],pause:0.01},
    {dur:0.22,f0:[128,72], F:[[330,300],[830,760]]},
  ],0.55));
}
function voiceYowzgees(){
  if(playClip('yowz',0.95)) return;
  // "geese" = real word, guaranteed hard G (made-up spellings get spelled out letter by letter)
  speak('yowz geese!',{pitch:0.9,rate:0.8,dur:1.2},()=>{
    say([
      {dur:0.26,f0:[140,82], F:[[650,320],[1150,800]],pause:0.02},
      {dur:0.10,f0:[82,95],  F:[[300,300],[2000,2200]],pause:0.01},
      {dur:0.32,f0:[100,145],F:[[290,290],[2200,2450]]},
    ],0.6);
    noise(0.10,0.10,2800,0.30);
    noise(0.09,0.12,7000,0.72);
  });
}

/* ---- intro score (scheduled once, all through one bus so skip can cut it) ---- */
function startIntroMusic(){
  G.introMusicWanted=true;   // schedules as soon as the context is genuinely running
  realStartIntroMusic(0);
}
function realStartIntroMusic(el){ // el = seconds of intro already elapsed (late unlock)
  if(!AU.on||G.introBus||AU.ctx.state!=='running') return;
  G.introMusicWanted=false;
  const bus=AU.ctx.createGain(); bus.gain.value=1; bus.connect(AU.master);
  G.introBus=bus;
  const t0=AU.ctx.currentTime;
  const oscAt=(f,type,vol,start,end,opts)=>{
    start-=el; end-=el;
    if(end<=0.1) return;          // cue already passed while audio was locked
    start=Math.max(start,0.02);
    const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0+start);
    if(opts&&opts.slideTo) o.frequency.exponentialRampToValueAtTime(opts.slideTo,t0+end);
    g.gain.setValueAtTime(0.0001,t0+start);
    g.gain.exponentialRampToValueAtTime(vol,t0+start+(opts&&opts.swell?opts.swell:0.04));
    g.gain.setValueAtTime(vol,t0+end-0.1);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+end);
    let node=o;
    if(opts&&opts.lp){ const fl=AU.ctx.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=opts.lp; o.connect(fl); node=fl; }
    node.connect(g); g.connect(bus); o.start(t0+start); o.stop(t0+end+0.05);
  };
  const thump=(start,vol)=>{ oscAt(72,'sine',vol||0.45,start,start+0.4,{slideTo:36}); };
  // ominous drone swelling under the text, sustained through the blackout,
  // cut dead exactly when UNTIL NOW. slams (7.6s)
  oscAt(55,'sawtooth',0.10,0,7.6,{swell:2.5,lp:420});
  oscAt(55.7,'sawtooth',0.08,0,7.6,{swell:2.5,lp:420});
  oscAt(27.5,'sine',0.22,0,7.6,{swell:2.5});
  // dark minor chord creeping in under lines 2-4 (D-F-A)

const keys={};
window.addEventListener('keydown',e=>{
  if(e.repeat) return; // held keys must not machine-gun through menus
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  onPressKey(e.key.toLowerCase());

const stick={active:false,id:null,sx:0,sy:0,dx:0,dy:0,downX:0,downY:0,downT:0,lastX:0,lastY:0};
const STICK_R=20; // px of drag for full speed — hair trigger
const taps=[];            // logical taps {x,y} this frame
let buttons=[];           // active on-screen buttons [{id,x,y,r,label,sub,kind}]
const btnHeld={};

function evtPos(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H};
}
function hitButton(p){
  for(const b of buttons){
    if(b.rect){ if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h) return b; }
    else if(dist(p.x,p.y,b.x,b.y)<=b.r+10) return b;
  }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); audioInit(); unlockAudio();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){} // keep the stick alive off-canvas
  // the boot tap must schedule the intro score HERE, inside the gesture, or iOS mutes it
  if(G.state==='boot'){ unlockTTS(); startIntroMusic(); }
  const p=evtPos(e);
  const b=hitButton(p);
  if(b){ btnHeld[b.id]=e.pointerId; onButton(b.id); return; }
  taps.push(p);
  if(!stick.active){
    stick.active=true; stick.id=e.pointerId; stick.sx=p.x; stick.sy=p.y; stick.dx=0; stick.dy=0;
    stick.downX=p.x; stick.downY=p.y; stick.downT=performance.now(); stick.lastX=p.x; stick.lastY=p.y;
  }
});
cv.addEventListener('pointermove',e=>{
  e.preventDefault();
  if(stick.active&&e.pointerId===stick.id){
    const p=evtPos(e);
    stick.lastX=p.x; stick.lastY=p.y;
    stick.dx=p.x-stick.sx; stick.dy=p.y-stick.sy;
    const m=Math.hypot(stick.dx,stick.dy);
    // steering: any drag sets the run direction; he keeps running after you let go
    if(m>20&&G.state==='live') G.runDir={x:stick.dx/m,y:stick.dy/m}; // matches the tap threshold: a gesture steers OR taps, never both
    // anchor trails so curving drags steer smoothly
    if(m>STICK_R){ stick.sx=p.x-stick.dx/m*STICK_R; stick.sy=p.y-stick.dy/m*STICK_R; stick.dx=stick.dx/m*STICK_R; stick.dy=stick.dy/m*STICK_R; }
  }
});
function endPointer(e,cancel){
  audioInit(); unlockAudio(); // some iOS versions only unlock audio on touch RELEASE
  if(stick.active&&e.pointerId===stick.id){
    // quick tap with no movement = throw to the receiver you tapped
    // (but iOS pointercancel — system gestures, palm rejection — must never count as a tap)
    const dx=stick.lastX-stick.downX, dy=stick.lastY-stick.downY;
    const quick=performance.now()-stick.downT<280;
    if(!cancel&&quick&&Math.hypot(dx,dy)<20)
      handleLiveTap({x:stick.lastX,y:stick.lastY});
    stick.active=false; stick.dx=0; stick.dy=0; // runDir persists — he keeps running
  }
  for(const id in btnHeld) if(btnHeld[id]===e.pointerId) delete btnHeld[id];
}
function handleLiveTap(p){
  if(G.state!=='live'||!G.playLive) return;
  if(G.passWindow&&!G.ball){
    const wy=p.y+G.camY; // screen tap -> field position
    let best=-1,bd=70;
    G.receivers.forEach((r,i)=>{
      if(r===G.carrier) return;
      const d=dist(p.x,wy,r.x,r.y);
      if(d<bd){ bd=d; best=i; }
    });
    if(best>=0) doThrow(best);
    return;
  }
  tryDive(); // no throw on the table: a tap means lay out
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',e=>endPointer(e,true));
window.addEventListener('pointerup',endPointer); // backstop if capture is unsupported

document.addEventListener('touchend',()=>{ audioInit(); unlockAudio(); },{passive:true});

function moveVec(){
  let x=0,y=0;
  if(keys['arrowleft']||keys['a'])x-=1;
  if(keys['arrowright']||keys['d'])x+=1;
  if(keys['arrowup']||keys['w'])y-=1;
  if(keys['arrowdown']||keys['s'])y+=1;
  const m=Math.hypot(x,y);
  if(m>1){x/=m;y/=m;}
  if(!x&&!y&&G.runDir) return {x:G.runDir.x,y:G.runDir.y}; // auto-run: full speed in last swiped direction
  return {x,y};
}

function updateFx(dt){
  shake=Math.max(0,shake-dt*40);
  flashWhite=Math.max(0,flashWhite-dt);
  zoomPunch=Math.max(0,zoomPunch-dt*0.5);
  G.shoutCd=Math.max(0,(G.shoutCd||0)-dt);
  for(let i=fxTexts.length-1;i>=0;i--){ fxTexts[i].t+=dt; if(fxTexts[i].t>fxTexts[i].dur)fxTexts.splice(i,1); }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.kind==='helmet'){
      if(p.landed){} // helmet litter: it stays where it fell
      else if(p.t>1.0){ p.landed=true; p.dur=7; p.vx=0; p.vy=0; p.vr=0; }
      else { p.vy+=700*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; }
    }
    else if(p.kind==='bulb'||p.kind==='ghost'){} // stationary
    else { const d2=Math.pow(0.92,dt*60); p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=d2; p.vy*=d2; }
    if(p.t>p.dur)parts.splice(i,1);
  }
}
function drawFxWorld(camY){
  for(const p of parts){
    const sy=p.y-camY;
    if(p.kind==='helmet'){
      ctx.save(); ctx.translate(p.x,sy); ctx.rotate(p.rot);
      ctx.globalAlpha=clamp(p.dur-p.t,0,1); // litter fades out at the end
      drawHelmetIcon(0,0,10,p.color,p.stripe);
      ctx.globalAlpha=1; ctx.restore();
    } else if(p.kind==='bulb'){
      if(p.t>p.blinkAt&&p.t<p.blinkAt+0.12){ ctx.fillStyle='#fff'; ctx.fillRect(p.x,sy,3,3); }
    } else if(p.kind==='ghost'){
      ctx.globalAlpha=0.25*(1-p.t/p.dur);
      ctx.fillStyle=p.color; ctx.fillRect(p.x-5,sy-8,10,14);
      ctx.globalAlpha=1;
    } else if(p.kind==='star'){
      ctx.fillStyle='#fff200';
      const s=4*(1-p.t/p.dur)+1;
      ctx.fillRect(p.x-s/2,sy-s/2,s,s);
      ctx.fillRect(p.x-s*1.2,sy-1,s*2.4,2);
      ctx.fillRect(p.x-1,sy-s*1.2,2,s*2.4);
    } else {
      ctx.fillStyle='rgba(210,200,170,'+(0.6*(1-p.t/p.dur))+')';
      ctx.beginPath(); ctx.arc(p.x,sy,4+p.t*10,0,7); ctx.fill();
    }
  }
}
function drawFxScreen(){
  for(const ft of fxTexts){
    const k=ft.t/ft.dur;
    const pop=k<0.15?k/0.15:1;
    const a=k>0.75?(1-k)/0.25:1;
    ctx.save();
    ctx.translate(ft.x,ft.y+(ft.wob?Math.sin(ft.t*18)*2:0));
    ctx.scale(0.4+0.6*pop,0.4+0.6*pop);
    ctx.globalAlpha=a;
    pixelText(ft.text,0,0,ft.size,ft.color,'#000',true);
    ctx.restore();
  }
  if(flashWhite>0){ ctx.fillStyle='rgba(255,255,255,'+Math.min(1,flashWhite*6)+')'; ctx.fillRect(0,0,W,H); }
}

/* ---------------- chunky text ---------------- */
function pixelText(str,x,y,size,fill,outline,center){
  ctx.font='bold '+size+'px "Courier New",monospace';
  if(str.length*size*0.62>W-16){ // only measure strings that might overflow
    const tw=ctx.measureText(str).width;
    if(tw>W-16){ size=Math.max(8,size*(W-16)/tw); ctx.font='bold '+size+'px "Courier New",monospace'; }
  }
  ctx.textAlign=center?'center':'left';
  ctx.textBaseline='middle';
  if(outline){ ctx.lineWidth=Math.max(3,size/7); ctx.strokeStyle=outline; ctx.strokeText(str,x,y); }
  ctx.fillStyle=fill; ctx.fillText(str,x,y);
}

function drawHelmetIcon(x,y,r,color,stripe){
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y,r,Math.PI*0.95,Math.PI*2.12); ctx.fill();
  ctx.fillRect(x-r,y-2,r*2,r*0.55);
  ctx.fillStyle=stripe; ctx.fillRect(x-r*0.18,y-r,r*0.36,r*0.8);
  ctx.fillStyle='#ccc'; ctx.fillRect(x+r*0.35,y+r*0.1,r*0.75,r*0.22); // facemask
}

function drawPlayer(p,camY){
  const sy=p.y-camY;

  const t=p.team, run=Math.sin(p.animT*16)*(p.moving?1:0);
  ctx.save();

  }

  // body

  ctx.fillStyle=t.jersey2; ctx.fillRect(-6,-6,12,2);
  // arms
  ctx.fillStyle=t.jersey; ctx.fillRect(-8,-4+run*1.5,2,5); ctx.fillRect(6,-4-run*1.5,2,5);

}

/* ---------------- formations / play start ---------------- */
function newPlayer(team,x,yd,role){
  return {team,x,y:yd2y(yd),vx:0,vy:0,spd:rnd(86,102),role,state:'idle',
    stateT:0,animT:rnd(0,9),moving:false,hasBall:false,helmetOn:true,marker:null,
    blockT:0,target:null,spinRot:0,reaction:rnd(0.2,0.6)};

function setupPlay(type){
  G.playType=type; G.players=[]; G.ball=null; G.passWindow=false; G.pastLine=false;
  G.truckCd=0; G.catchGrace=0; G.catchBurst=0; G.returnPlay=false; G.kickFlight=null; G.runDir=null; G.handoffPending=false; G.dive=null;
  G.stumbleT=0; G.cavalry=false; G.crossT=0;
  const L=G.losYd;
  const P=G.players;
  // offense
  const ol1=newPlayer(TEAM_YOU,200,L+0.6,'OL'), ol2=newPlayer(TEAM_YOU,240,L+0.6,'OL'), ol3=newPlayer(TEAM_YOU,280,L+0.6,'OL');
  const qb=newPlayer(TEAM_YOU,240,L+5,'QB');
  const rb=newPlayer(TEAM_YOU,198,L+5.5,'RB');
  const wrA=newPlayer(TEAM_YOU,70,L+0.6,'WR'); const wrB=newPlayer(TEAM_YOU,410,L+0.6,'WR');
  qb.spd=104; rb.spd=rnd(112,118); wrA.spd=rnd(104,116); wrB.spd=rnd(104,116);
  P.push(ol1,ol2,ol3,qb,rb,wrA,wrB);
  G.qb=qb; G.receivers=[wrA,wrB];
  // defense
  const dl1=newPlayer(TEAM_CPU,205,L-1.2,'DL'), dl2=newPlayer(TEAM_CPU,240,L-1.2,'DL'), dl3=newPlayer(TEAM_CPU,275,L-1.2,'DL');
  const lb1=newPlayer(TEAM_CPU,180,L-5,'LB'), lb2=newPlayer(TEAM_CPU,300,L-5,'LB');
  const db1=newPlayer(TEAM_CPU,75,L-7,'DB'), db2=newPlayer(TEAM_CPU,405,L-7,'DB');
  db1.cover=wrA; db2.cover=wrB;
  db1.spd=rnd(96,106); db2.spd=rnd(96,106);
  // coverage dice: each DB independently rolls beaten / normal / blanket
  [db1,db2].forEach(db=>{
    const r=Math.random();
    if(r<0.22){ db.covSpd=0.75; db.covLagY=20; db.reaction=rnd(0.8,1.3); } // beaten — bites late, trails
    else if(r<0.75){ db.covSpd=rnd(0.95,1.04); db.covLagY=-16; }          // honest coverage
    else { db.covSpd=1.14; db.covLagY=-22; db.reaction=rnd(0.05,0.15); }  // blanket — do not test him
  });
  lb1.lbHold=rnd(1.2,3.2); lb2.lbHold=rnd(1.2,3.2);
  // a linebacker shadows the back out of the backfield
  lb1.cover=rb; lb1.covSpd=rnd(0.88,1.05); lb1.covLagY=-12;
  P.push(dl1,dl2,dl3,lb1,lb2,db1,db2);
  // blocking assignments
  ol1.blockTarget=dl1; ol2.blockTarget=dl2; ol3.blockTarget=dl3;
  // pass rush dice (independent of coverage): stone wall / normal / collapse
  const rushRoll=Math.random();
  if(rushRoll<0.20) [ol1,ol2,ol3].forEach(o=>o.blockT=rnd(2.8,4.2));      // all day to throw
  else if(rushRoll<0.75) [ol1,ol2,ol3].forEach(o=>o.blockT=rnd(1.3,2.4)); // normal pocket
  else {                                                                   // line collapses...
    [ol1,ol2,ol3].forEach(o=>o.blockT=rnd(1.0,1.8));
    const whiff=pick([ol1,ol2,ol3]);                                       // ...and one man whiffs:
    whiff.blockT=rnd(0.25,0.6);
    whiff.blockTarget.spd=rnd(110,124);                                    // his rusher comes in HOT
  }
  // routes
  if(type==='short'){
    wrA.routePts=[{x:190,y:yd2y(L-8)}]; wrB.routePts=[{x:400,y:yd2y(L-7)}];
  } else if(type==='bomb'){
    wrA.routePts=[{x:120,y:yd2y(L-26)}]; wrB.routePts=[{x:370,y:yd2y(L-28)}];
  }
  if(type!=='run'){
    wrA.marker='A'; wrB.marker='B'; G.passWindow=true;
    // RB runs a real route out of the backfield: wheel (swing then turn upfield)
    // or an angle route (out, then cut back over the middle)
    const side=Math.random()<0.5;
    rb.routePts=Math.random()<0.6
      ?[{x:side?365:115,y:yd2y(L+0.5)},{x:side?385:95,y:yd2y(L-14)}]  // wheel
      :[{x:side?330:150,y:yd2y(L-1)},{x:240,y:yd2y(L-11)}];           // angle
    rb.marker='C'; G.receivers.push(rb);
  }
  // carrier
  if(type==='run'){
    // QB takes the snap; the back crosses the mesh point and takes the exchange
    qb.hasBall=true; G.carrier=qb;
    G.handoffPending=true; G.rbRef=rb;
    G.passWindow=false;
    // wideouts earn their paycheck: stalk-block the corners across from them
    wrA.blockTarget=db1; wrA.blockT=rnd(1.4,2.8);
    wrB.blockTarget=db2; wrB.blockT=rnd(1.4,2.8);
  } else {
    qb.hasBall=true; G.carrier=qb;
  }
  G.camY=yd2y(L)-H*0.55;
  G.playLive=true;
  setState('live');
  sfx.hike();
  makeLiveButtons();
}

  if(G.passWindow){

    buttons.push({id:'throwB',x:138,y:H-92,r:32,label:'B',kind:'round'});

/* ---------------- buttons / key actions ---------------- */
function onButton(id){
  if(G.state==='playcall'){
    if(id.startsWith('play_')){ sfx.ui(); startSnap(id.slice(5)); }
    return;
  }
  if(G.state==='live'){
    if(id==='truck') doTruck();
    if(id==='throwA') doThrow(0);
    if(id==='throwB') doThrow(1);
    if(id==='throwC') doThrow(2);

function onPressKey(k){
  if(G.state==='live'){

    if(k==='x') doThrow(1);
    if(k==='c') doThrow(2);
    if(k==='shift') tryDive();
  }
  if((k==='enter'||k===' ')&&['title','intro','howto','dead','gameover'].includes(G.state)) advanceTap();
  if(G.state==='playcall'&&/^[1-5]$/.test(k)){ // keyboard play-calling
    const b=buttons[+k-1];
    if(b) onButton(b.id);
  }
  if(G.state==='kickmeter'&&(k===' '||k==='enter')) taps.push({x:W/2,y:H/2});

/* ---------------- truck & throw ---------------- */
function doTruck(){
  if(!G.playLive||G.truckCd>0||!G.carrier) return;
  G.truckCd=G.rampage>0?0.25:2.0; // berserk mode barely reloads
  const c=G.carrier;
  let best=null,bd=46;
  for(const p of G.players){
    if(p.team!==TEAM_CPU||p.state==='prone'||p.state==='flying') continue;
    const d=dist(c.x,c.y,p.x,p.y);
    if(d<bd){bd=d;best=p;}
  }
  if(best){
    const dx=best.x-c.x, dy=best.y-c.y, m=Math.max(1,Math.hypot(dx,dy));
    const counter=best.state==='dive'; // trucking a mid-air tackler: art
    const v=counter?630:420;
    best.state='flying'; best.stateT=counter?0.7:0.55; best.vx=dx/m*v; best.vy=dy/m*v; best.spinRot=0;
    best.helmetOn=false;
    const shout=carnage(best.x,best.y,TEAM_CPU,true);
    G.vhhCount+=counter?2:1;
    bigText(counter?'+2 COUNTER-TRUCK!!':'+1 VERY HARD HIT',{y:H*0.46,size:counter?24:20,color:'#7dff6a',dur:0.9});
    // announcer growls it about a third of the time
    if(Math.random()<0.33&&!G.shoutCd){ G.shoutCd=4; speak(shout.toLowerCase().replace(/[!.’']/g,''),{pitch:0.7,rate:0.95,dur:1.0}); }
    // every 3rd VHH: RAMPAGE
    if(G.vhhCount>0&&Math.floor(G.vhhCount/3)>Math.floor((G.vhhCount-(counter?2:1))/3)){
      G.rampage=6; sfx.cheer();
      bigText('HE’S GONE BERSERK!!',{y:H*0.28,size:34,color:'#ff5050',dur:1.4});
    }
    if(G.vhhCount===5) bigText('THE COMMISSIONER HAS BEEN NOTIFIED',{y:H*0.55,size:16,color:'#9fd8ff',dur:1.6});
    if(G.vhhCount===10) bigText('THE LEAGUE HAS DISBANDED ITS SAFETY COMMITTEE',{y:H*0.55,size:15,color:'#9fd8ff',dur:1.8});
  } else { // whiff: you lunged at nothing and your legs know it
    sfx.thud(); spawnDust(c.x,c.y);
    G.stumbleT=0.4;
    bigText('WHIFFED!',{y:H*0.5,size:16,color:'#999',dur:0.5});
  }
}
function tryDive(){
  const c=G.carrier;
  if(!G.playLive||G.dive||!c||!c.hasBall||G.handoffPending) return;
  if(c.y>yd2y(G.losYd)-2) return; // must be past the line of scrimmage
  let vx=c.vx,vy=c.vy; const m=Math.hypot(vx,vy);
  if(m<20){ vx=0; vy=-1; } else { vx/=m; vy/=m; }
  const sp=(c.spd+18)*1.55;
  G.dive={t:0,dur:0.42,vx:vx*sp,vy:vy*sp};
  c.state='diving'; c.spinRot=Math.atan2(vy,vx)+Math.PI/2;
  G.runDir=null;
  sfx.throwFx(); spawnDust(c.x,c.y);
  bigText('DIVE!',{size:22,color:'#9fd8ff',dur:0.5,y:H*0.52});
}
function doThrow(i){
  if(!G.playLive||!G.passWindow||G.ball) return;
  if(G.pastLine){ bigText('PAST THE LINE!',{size:26,color:'#ff5050'}); return; }
  const r=G.receivers[i]; if(!r) return;
  const qb=G.carrier;
  const d=dist(qb.x,qb.y,r.x,r.y);
  const dur=clamp(d/520,0.35,1.5);
  // lead the receiver
  const tx=clamp(r.x+(r.routeVx||0)*dur,FX0+8,FX1-8), ty=r.y+(r.routeVy||0)*dur;
  G.ball={fx:qb.x,fy:qb.y,tx,ty,t:0,dur,target:r};
  qb.hasBall=false; G.passWindow=false;
  G.receivers.forEach(w=>w.marker=null);
  buttons=buttons.filter(b=>b.id==='truck');
  sfx.throwFx();
}

/* ---------------- kick & punt returns ---------------- */
function setupReturn(kind){
  G.playType='return'; G.returnPlay=true; G.players=[]; G.ball=null;
  G.passWindow=false; G.pastLine=false;
  G.truckCd=0; G.catchGrace=0; G.catchBurst=0; G.runDir=null; G.dive=null;
  G.stumbleT=0; G.cavalry=false; G.crossT=0;
  const startYd=kind==='kick'?rnd(88,96):rnd(58,68);
  G.losYd=startYd; G.down=1; G.toGo=10; G.firstYd=startYd-10;
  const ret=newPlayer(TEAM_YOU,rnd(180,300),startYd,'RET');
  ret.spd=112; G.carrier=ret; G.qb=null; G.receivers=[];
  G.players.push(ret);
  // coverage team thundering downfield
  const cov=[];
  for(let i=0;i<7;i++){
    const cv=newPlayer(TEAM_CPU,45+i*65+rnd(-14,14),startYd-(kind==='kick'?rnd(26,40):rnd(13,24)),'COV');
    cv.spd=rnd(86,104); cv.reaction=rnd(0.1,0.4);
    cov.push(cv); G.players.push(cv);
  }
  // your wedge: four blockers, each picks up the nearest free coverage man
  for(let i=0;i<4;i++){
    const b=newPlayer(TEAM_YOU,100+i*90+rnd(-18,18),startYd-rnd(5,11),'OL');
    b.blockT=rnd(1.4,2.8); b.spd=rnd(85,95);
    let best=null,bd=1e9;
    for(const cv of cov){ if(cv.claimed)continue; const d=dist(b.x,b.y,cv.x,cv.y); if(d<bd){bd=d;best=cv;} }
    if(best){ best.claimed=true; b.blockTarget=best; }
    G.players.push(b);
  }
  // ball in the air; you can position under it but can't be hit yet
  G.kickFlight={t:0,dur:kind==='kick'?1.25:0.95,fx:rnd(160,320),fy:yd2y(35)};
  G.camY=yd2y(startYd)-H*0.55;
  G.playLive=true;
  setState('live');
  sfx.thud(); sfx.crowd();
  bigText(kind==='kick'?'KICKOFF!':'PUNT RETURN!',{size:32,dur:1.0});
  makeLiveButtons();
}

function recordGain(yds){ if(yds>G.longestPlay) G.longestPlay=Math.round(yds); }
const TD_QUIPS=['PUT IT ON THE FRIDGE!','1994 WOULD BE PROUD!','SUCK IT, BONE COUNTY!','SEE YOU IN THE END ZONE, NERDS!'];
function afterPlay(){
  const o=G.deadOpts||{};
  const wasReturn=G.returnPlay; G.returnPlay=false;
  // two-point conversion attempt resolves here
  if(G.conversion){
    G.conversion=false;
    if(o.td){ G.score.you+=2; sfx.td();
      queueBanner(['GOOD!! +2','VERY HARD INDEED'],()=>endOfYourDrive());
    } else { sfx.fail();
      queueBanner(['NO GOOD','GREED IS A SIN'],()=>endOfYourDrive());
    }
    return;
  }
  if(o.td){
    recordGain(G.losYd); // scored from the line of scrimmage (or the catch spot, on returns)
    G.score.you+=6; sfx.td();
    if(G.ot){ // sudden death: the six wins it, skip the formality
      queueBanner(['TOUCHDOWN','SKULLCRUSHERS WIN IT!','+6'],()=>endOfYourDrive());
      return;
    }
    queueBanner([wasReturn?'RETURN TOUCHDOWN!!':'TOUCHDOWN',pick(TD_QUIPS),'+6'],
      ()=>{ G.convChoice=true; setState('playcall'); });
    return;
  }
  if(o.turnover){ queueBanner([o.turnover],()=>endOfYourDrive()); return; }
  if(wasReturn){
    const s2=clamp(y2yd(o.spotY!==undefined?o.spotY:G.carrier.y),2,97);
    recordGain(G.losYd-s2); // return yardage counts
    G.losYd=s2; G.down=1; G.toGo=Math.min(10,s2); G.firstYd=Math.max(0,s2-10);
    const own=s2>50;
    queueBanner(['RETURNED TO THE',(own?'OWN ':'BRUISERS ')+Math.round(own?100-s2:s2)+' YARD LINE'],
      ()=>G.clock<=0?endOfYourDrive():setState('playcall'));
    return;
  }
  const spotYd=clamp(y2yd(o.spotY!==undefined?o.spotY:G.carrier.y),0.5,109);
  if(spotYd>=100){ // brought down in your own end zone (returns exempt — handled above)
    G.score.cpu+=2; sfx.fail();
    queueBanner(['SAFETY!','IN YOUR OWN HOUSE?!','BRUISERS +2'],()=>endOfYourDrive());
    return;
  }
  const gain=G.losYd-spotYd;
  recordGain(gain);
  if(!o.noAdvance){
    G.losYd=spotYd;
    if(spotYd<=G.firstYd){
      G.down=1; G.firstYd=Math.max(0,spotYd-10); G.toGo=Math.min(10,spotYd);
      sfx.firstDown(); bigText('FIRST DOWN!',{size:30,color:'#7dff6a',dur:0.9});
    } else {
      G.down++; G.toGo=spotYd-G.firstYd;
    }
  } else {
    G.down++;
  }
  if(G.down>4){
    queueBanner(['TURNOVER','ON DOWNS!'],()=>endOfYourDrive());
    return;
  }
  if(o.runoff) G.clock=Math.max(0,G.clock-15); // huddle runoff; incompletions and OOB stop the clock
  if(G.clock<=0){
    queueBanner(['TIME EXPIRES',(G.quarter>=4&&!G.ot)?'END OF REGULATION':'END OF THE DRIVE'],()=>endOfYourDrive());
    return;
  }
  setState('playcall');
}

  setState('banner');
}

/* ---------------- drives / quarters ---------------- */
function startYourDrive(mode){
  mode=mode||'kickoff';
  G.clock=180; // your 3:00 of the quarter — the Bruisers' half happens off-screen
  G.fdDraw=undefined;
  const q='Q'+G.quarter+(G.ot?' — OVERTIME':'')+' — YOUR POSSESSION';
  const stakes=G.quarter>=4?'MAKE IT COUNT. NO REFUNDS.':'MAKE IT COUNT';
  const go=()=>{
    if(mode==='punt'){
      queueBanner([q,'BRUISERS PUNT IT AWAY','RETURN IT!'],()=>setupReturn('punt'));
    } else if(mode==='turnover'){
      const spot=Math.round(rnd(45,68));
      G.losYd=spot; G.down=1; G.toGo=10; G.firstYd=spot-10;
      queueBanner([q,'YOUR DEFENSE DELIVERS!',stakes],()=>setState('playcall'));
    } else {
      queueBanner([q,'KICKOFF!','RETURN IT!'],()=>setupReturn('kick'));
    }
  };
  if(G.quarter===3&&!G.halftimeDone){ // the halftime show
    G.halftimeDone=true;
    queueBanner(['HALFTIME SHOW: CANCELED.','THE BAND IS SCARED.'],go);
  } else go();
}
function modeFromSim(){

  }

function startSimDrive(){

  const prob=type==='fg'?clamp(1.08-distYds/58,0.10,0.92):(type==='xp'?0.62:0.5);

function resolveKick(){

/* ---------------- live play update ---------------- */
function updateLive(dt){
  const c=G.carrier;
  G.truckCd=Math.max(0,G.truckCd-dt);
  // move carrier
  const mv=moveVec();
  const preClock=G.clock;
  G.clock=Math.max(0,G.clock-dt); // clock runs while the play is live
  if(G.quarter>=4&&G.clock<15&&G.clock>0&&Math.ceil(G.clock)!==Math.ceil(preClock))
    tone(1100,0.05,'square',0.08); // final-seconds dread tick
  G.stumbleT=Math.max(0,(G.stumbleT||0)-dt);
  G.rampage=Math.max(0,(G.rampage||0)-dt);
  // past the line and still up: the defense eventually sends everyone
  if(c.hasBall&&c.y<yd2y(G.losYd)&&!G.returnPlay){
    G.crossT=(G.crossT||0)+dt;
    if(G.crossT>2.5&&!G.cavalry){ G.cavalry=true; bigText('HERE COMES THE CAVALRY!',{y:H*0.3,size:22,color:'#ff9f50',dur:1.0}); }
  }
  // speed trail while the adrenaline is real
  if(c.moving&&(G.catchBurst>0||G.rampage>0||Math.hypot(c.vx,c.vy)>124)){
    G.ghostT=(G.ghostT||0)-dt;
    if(G.ghostT<=0){ G.ghostT=0.06; spawnGhost(c); }
  }
  if(G.handoffPending){ // the mesh: RB runs to the QB, ball changes hands on contact
    const r2=G.rbRef;
    const d=dist(r2.x,r2.y,c.x,c.y);
    if(d>13){
      r2.x+=(c.x-r2.x)/d*r2.spd*dt; r2.y+=(c.y-r2.y)/d*r2.spd*dt;
      r2.moving=true; r2.animT+=dt*1.3;
    } else {
      c.hasBall=false; r2.hasBall=true; G.carrier=r2; G.handoffPending=false;
      sfx.catchFx();
    }
  }
  G.catchGrace=Math.max(0,(G.catchGrace||0)-dt);
  G.catchBurst=Math.max(0,(G.catchBurst||0)-dt);
  if(G.kickFlight){ // kick/punt hanging in the air — get under it
    const k=G.kickFlight; k.t+=dt;
    if(k.t>=k.dur){
      G.kickFlight=null; G.carrier.hasBall=true;
      sfx.catchFx(); G.catchGrace=0.35; G.catchBurst=0.5;
      bigText('GOT IT! GO!!',{size:26,color:'#9fd8ff',dur:0.7});
    }
  }
  if(G.dive){ // airborne: locked trajectory until he lands
    const dv=G.dive; dv.t+=dt;
    c.x=clamp(c.x+dv.vx*dt,FX0+6,FX1-6); c.y+=dv.vy*dt;
    if(c.y<=0&&c.hasBall){ endPlay('',{td:true,silent:true}); return; }
    if(dv.t>=dv.dur){
      G.dive=null; c.state='idle'; spawnDust(c.x,c.y); sfx.thud();
      endPlay('DOVE FORWARD',{spotY:c.y,runoff:true});
      return;
    }
  }
  // DIVE button appears exactly when a dive is legal
  const canDive=c.hasBall&&!G.dive&&!G.handoffPending&&!G.passWindow&&c.state!=='prone'&&c.y<yd2y(G.losYd)-2;
  const hasDiveBtn=buttons.some(b=>b.id==='dive');
  if(canDive&&!hasDiveBtn) buttons.push({id:'dive',x:58,y:H-92,r:34,label:'DIVE',kind:'round'});
  if(!canDive&&hasDiveBtn) buttons=buttons.filter(b=>b.id!=='dive');
  let cspd=(c.state==='prone'||c.state==='diving'||G.handoffPending)?0:c.spd+18; // no steering while flattened, diving, or mid-mesh
  if(G.catchBurst>0) cspd*=1.22;         // fresh-catch adrenaline
  if(G.kickFlight) cspd*=0.4;            // positioning under a kick, not sprinting for free yards
  if(c.role==='QB'&&c.hasBall&&!G.handoffPending) cspd*=0.92; // he's a QB, not a track star
  if(G.stumbleT>0) cspd*=0.55;           // whiffed truck: legs say no
  c.vx=mv.x*cspd; c.vy=mv.y*cspd;
  c.x+=c.vx*dt; c.y+=c.vy*dt;
  c.moving=(Math.abs(c.vx)+Math.abs(c.vy))>10;
  c.animT+=dt*(c.moving?1.4:0.3);
  // sidelines
  if(c.x<FX0+6||c.x>FX1-6){
    c.x=clamp(c.x,FX0+6,FX1-6);
    if(c.hasBall){
      if(c.y<=0){ endPlay('',{td:true,silent:true}); return; } // pylon dive: the TD beats the sideline
      endPlay('RAN OUT OF BOUNDS'); return;
    } // no ball in hand (pass in flight / kick dropping)? just clamp
  }
  // past line of scrimmage kills the pass
  if(G.passWindow&&c.y<yd2y(G.losYd)-4){
    G.pastLine=true; G.passWindow=false;
    G.receivers.forEach(w=>w.marker=null);
    buttons=buttons.filter(b=>b.id==='truck');
    bigText('QB TAKES OFF!',{size:24,color:'#9fd8ff',dur:0.8});
  }
  // touchdown
  if(c.y<=0&&c.hasBall){ endPlay('',{td:true,silent:true}); return; } // touchdowns require the ball
  // own endzone clamp
  c.y=Math.min(c.y,yd2y(109));

  // receivers run routes (multi-waypoint)
  for(const w of G.receivers){
    if(w===c) continue;
    if(G.ball&&G.ball.target===w){ // ball's up: forget the route, go get it
      const dx=G.ball.tx-w.x, dy=G.ball.ty-w.y, m=Math.hypot(dx,dy);
      if(m>4){ w.routeVx=dx/m*w.spd; w.routeVy=dy/m*w.spd; }
      else { w.routeVx=0; w.routeVy=0; }
      w.x+=w.routeVx*dt; w.y+=w.routeVy*dt; w.moving=m>4; w.animT+=dt*1.3;
      continue;
    }
    if(w.routePts){
      w.routeI=w.routeI||0;
      const tp=w.routePts[w.routeI];
      if(tp){
        const dx=tp.x-w.x, dy=tp.y-w.y, m=Math.hypot(dx,dy);
        if(m>6){ w.routeVx=dx/m*w.spd; w.routeVy=dy/m*w.spd; }
        else w.routeI++; // hit the break point, on to the next leg
      } else { w.routeVx=0; w.routeVy=-48; } // route done: keep working upfield
      w.x+=w.routeVx*dt; w.y+=w.routeVy*dt; w.moving=true; w.animT+=dt*1.3;
    }
  }
  // blockers shuffle
  for(const p of G.players){
    if(p.team===TEAM_YOU&&p.blockTarget){ // anyone with a blocking assignment: line, wedge, or stalk-blocking WRs
      p.blockT-=dt;
      if(p.blockTarget&&p.blockT>0){
        const bd=dist(p.x,p.y,p.blockTarget.x,p.blockTarget.y);
        if(bd>30){ // far assignment (return wedge): run to your man
          p.x+=(p.blockTarget.x-p.x)/bd*p.spd*dt;
          p.y+=(p.blockTarget.y-p.y)/bd*p.spd*dt;
        } else {
          p.x=lerp(p.x,p.blockTarget.x,0.1); p.y=lerp(p.y,p.blockTarget.y+12,0.2);
        }
        p.animT+=dt; p.moving=true;
      }
    }
  }
  // defenders
  for(const p of G.players){
    if(p.team!==TEAM_CPU) continue;
    p.stateT-=dt;
    if(p.state==='flying'){
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      const fdec=Math.pow(0.9,dt*60); p.vx*=fdec; p.vy*=fdec; p.spinRot+=14*dt;
      p.x=clamp(p.x,FX0+4,FX1-4);
      if(p.stateT<=0){ p.state='prone'; p.stateT=1.3; }
      continue;
    }
    if(p.state==='prone'){
      if(p.stateT<=0){ p.state='chase'; p.helmetOn=true; }
      continue;
    }
    p.reaction-=dt;
    if(p.reaction>0) continue;
    // blocked?
    let blocked=false;
    for(const o of G.players){
      if(o.team===TEAM_YOU&&o.blockTarget===p&&o.blockT>0&&dist(o.x,o.y,p.x,p.y)<26){blocked=true;break;}
    }
    if(blocked){ p.animT+=dt*0.6; continue; }
    // coverage before ball is loose
    let tx,ty,speed=p.spd;
    if(p.cover&&G.passWindow&&!G.pastLine){ // DBs on wideouts, LB1 spying the back
      tx=p.cover.x; ty=p.cover.y+(p.covLagY||-16);
      speed=p.spd*(p.covSpd||1);
    } else if(p.role==='LB'&&G.passWindow&&p.stateT>-(p.lbHold||2.2)){
      tx=p.x; ty=p.y; // hold zone briefly
    } else {
      // pursue carrier (with prediction)
      if(G.ball){ tx=G.ball.tx; ty=G.ball.ty; } // ball in the air: break on the landing spot, not the prone QB
      else { tx=c.x+c.vx*0.28; ty=c.y+c.vy*0.28; }
      if(G.cavalry) speed*=1.15; // the cavalry has arrived
    }
    if(G.ball&&p.cover&&G.ball.target===p.cover){ tx=G.ball.tx; ty=G.ball.ty; speed=p.spd*1.15; }
    const dx=tx-p.x, dy=ty-p.y, m=Math.hypot(dx,dy);
    if(p.state==='dive'){
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.stateT<=0){ p.state='prone'; p.stateT=0.85; spawnDust(p.x,p.y); }
    } else if(m>2){
      p.x+=dx/m*speed*dt; p.y+=dy/m*speed*dt; p.moving=true; p.animT+=dt*1.3;
    }
    // dive at carrier
    const dToC=dist(p.x,p.y,c.x,c.y);
    if(p.state!=='dive'&&dToC<46&&dToC>14&&c.state!=='prone'&&G.catchGrace<=0&&!G.kickFlight&&Math.random()<6*dt){
      const ddx=(c.x+c.vx*0.18)-p.x, ddy=(c.y+c.vy*0.18)-p.y, dm=Math.max(1,Math.hypot(ddx,ddy));
      p.state='dive'; p.stateT=0.32; p.vx=ddx/dm*230; p.vy=ddy/dm*230;
      sfx.thud();
    }
    // tackle contact
    if(dToC<15&&c.state!=='prone'&&G.catchGrace<=0&&!G.kickFlight&&(p.state==='chase'||p.state==='dive'||p.state==='idle')){
      tackle(p);
      return;
    }
  }
  // ball in flight
  if(G.ball){
    const b=G.ball; b.t+=dt;
    const k=b.t/b.dur;
    b.x=lerp(b.fx,b.tx,k); b.y=lerp(b.fy,b.ty,k);
    if(k>=1){
      const r=b.target;
      // receiver tries to be at landing spot
      let nearestD=1e9;
      for(const p of G.players){ if(p.team===TEAM_CPU&&p.state!=='prone'&&p.state!=='flying')
        nearestD=Math.min(nearestD,dist(p.x,p.y,r.x,r.y)); }
      const dr=dist(b.tx,b.ty,r.x,r.y);
      const throwDist=dist(b.fx,b.fy,b.tx,b.ty);
      G.ball=null;
      const incomplete=()=>endPlay(pick(['INCOMPLETE','NOBODY HOME','THROWN TO A GHOST','THE BALL HAS FILED A COMPLAINT']),
        {noAdvance:true,spotY:yd2y(G.losYd)});
      if(dr<26){
        // testing a blanket corner deep is how you get baited
        const blanket=G.players.find(p=>p.team===TEAM_CPU&&p.cover===r&&(p.covSpd||1)>1.1
          &&p.state!=='prone'&&p.state!=='flying'&&dist(p.x,p.y,r.x,r.y)<26);
        if(blanket&&throwDist>yd2y(19)&&Math.random()<0.40){ // bait rule is for testing him DEEP
          sfx.pick(); bigText('HE BAITED YOU, SON!',{size:32,color:'#ff5050'});
          endPlay('',{turnover:'INTERCEPTED!',silent:true});
        } else {
          // completion odds scale with real separation — open men catch, glued men don't
          let pCatch=clamp((nearestD-6)/30,0.18,0.95);
          if(r.role==='RB') pCatch=Math.min(0.95,pCatch+0.25); // the checkdown is the safe one, that's its whole job
          if(Math.random()<pCatch){
            // CATCH
            r.hasBall=true; G.carrier=r; r.routePts=null; r.routeVx=0; r.routeVy=0;
            sfx.catchFx(); bigText('CAUGHT!',{size:24,color:'#9fd8ff',dur:0.6});
            hitstop=Math.max(hitstop,0.06); spawnStars(r.x,r.y,4); // the catch deserves a beat
            G.catchGrace=r.role==='RB'?0.65:0.5; G.catchBurst=0.7;
            G.runDir=null; // new ball carrier awaits your swipe
            G.receivers.forEach(w=>w.marker=null);
            // shove the swarm off the catch point so the grace window is honest
            for(const p of G.players){
              if(p.team!==TEAM_CPU) continue;
              const d=dist(p.x,p.y,r.x,r.y);
              if(d<20){ const m2=Math.max(1,d); p.x=r.x+(p.x-r.x)/m2*28; p.y=r.y+(p.y-r.y)/m2*28; }
            }
          } else if(nearestD<18&&Math.random()<0.20){
            sfx.pick(); bigText('PICKED OFF!',{size:36,color:'#ff5050'});
            endPlay('',{turnover:'INTERCEPTED!',silent:true});
          } else incomplete();
        }
      } else incomplete();
    }
  }
  // camera
  G.camTarget=c.y-H*0.52+Math.min(0,c.vy*0.35); // look ahead when sprinting upfield
  G.camY=lerp(G.camY,clamp(G.camTarget,-EZ,yd2y(110)-H+40),1-Math.pow(0.88,dt*60));
}
function tackle(defender){
  const c=G.carrier;
  const rel=Math.hypot(c.vx,c.vy)+defender.spd;
  const mega=rel>150||defender.state==='dive';
  c.helmetOn=false; c.state='prone';
  carnage(c.x,c.y,TEAM_YOU,mega);
  G.vhhTaken++;
  if(G.ball){ // ball already in the air: QB eats the hit but the pass lives
    bigText('QB SMASHED!',{y:H*0.46,size:22,color:'#ff8080',dur:0.8});
    return;
  }
  const sackish=c===G.qb&&c.y>yd2y(G.losYd);
  endPlay(sackish?'SACKED!':'TACKLED',{spotY:c.y,silent:true,runoff:true}); // tackled inbounds: clock keeps bleeding
}

/* ---------------- drawing: field ---------------- */
/* The field is pre-rendered once to an offscreen canvas (cheap to blit,
   so it can afford real detail), then sliced by the camera each frame. */
let fieldCv=null;
const FOFF=EZ+300; // world y + FOFF = field-canvas y (padding above/below for camera overshoot)
function buildField(){
  fieldCv=document.createElement('canvas');
  fieldCv.width=W; fieldCv.height=Math.ceil(yd2y(110)+FOFF+300);
  const c=fieldCv.getContext('2d'); c.imageSmoothingEnabled=false;
  const Y=yd=>yd2y(yd)+FOFF;
  const FW=FX1-FX0;
  // ---- stands & crowd ----
  c.fillStyle='#15151f'; c.fillRect(0,0,W,fieldCv.height);
  const crowdCols=['#3a3a4e','#54465c','#4e5a46','#5c4646','#46505c','#6b6b7a','#7a6b54'];
  for(let y=0;y<fieldCv.height;y+=7){
    for(let x=0;x<W;x+=7){
      if(x>FX0-16&&x<FX1+16&&y>Y(-10)-16&&y<Y(110)+16) continue;
      if(Math.random()<0.8){
        c.fillStyle=crowdCols[(Math.random()*crowdCols.length)|0];
        c.fillRect(x+rnd(0,3),y+rnd(0,3),4,4);
      }
    }
  }
  // stadium wall
  c.strokeStyle='#3c3c50'; c.lineWidth=6;
  c.strokeRect(FX0-13,Y(-10)-13,FW+26,yd2y(120)+26);
  // green apron between wall and sidelines
  c.fillStyle='#14591f'; c.fillRect(FX0-10,Y(-10)-10,FW+20,yd2y(120)+20);
  // ---- grass: mowing stripes + texture ----
  for(let yd=-10;yd<110;yd+=5){
    c.fillStyle=(Math.floor(yd/5)%2===0)?'#1f7d31':'#1a6f2a';
    c.fillRect(FX0,Y(yd),FW,5*PPY);
  }
  c.fillStyle='rgba(255,255,255,0.03)'; // faint vertical mow columns
  for(let x=FX0;x<FX1;x+=55) c.fillRect(x,Y(-10),27,yd2y(120));
  for(let i=0;i<2800;i++){ // grass blade speckle
    c.fillStyle=Math.random()<0.5?'rgba(0,0,0,0.08)':'rgba(190,255,190,0.05)';
    c.fillRect(rnd(FX0,FX1),rnd(Y(-10),Y(110)),2,2);
  }
  // ---- endzones: team color, diagonal sheen, name ----
  const endzone=(y0,base,text,txtCol,outCol)=>{
    c.fillStyle=base; c.fillRect(FX0,y0,FW,EZ);
    c.save(); c.beginPath(); c.rect(FX0,y0,FW,EZ); c.clip();
    c.strokeStyle='rgba(255,255,255,0.07)'; c.lineWidth=12;
    for(let x=FX0-160;x<FX1+40;x+=36){
      c.beginPath(); c.moveTo(x,y0-12); c.lineTo(x+110,y0+EZ+12); c.stroke();
    }
    c.restore();
    c.font='bold 30px "Courier New",monospace'; c.textAlign='center'; c.textBaseline='middle';
    const tw=c.measureText(text).width, fit=Math.min(1,(FW-24)/tw);
    c.save(); c.translate(W/2,y0+EZ/2); c.scale(fit,fit);
    c.lineWidth=5; c.strokeStyle=outCol; c.strokeText(text,0,0);
    c.fillStyle=txtCol; c.fillText(text,0,0);
    c.restore();
  };
  endzone(Y(-10),'#4a1d7a','BRUISERS','#ff7a00','#2a1045');
  endzone(Y(100),'#006e64','SKULLCRUSHERS','#aafff2','#053a35');
  // ---- yard lines ----
  for(let yd=5;yd<100;yd+=5){
    c.fillStyle=yd%10===0?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.45)';
    c.fillRect(FX0,Y(yd)-1,FW,2);
  }
  // per-yard hash marks (two inner columns) + sideline ticks
  c.fillStyle='rgba(255,255,255,0.4)';
  for(let yd=1;yd<100;yd++){
    if(yd%5===0) continue;
    const y=Y(yd);
    c.fillRect(183,y,8,2); c.fillRect(289,y,8,2);   // inboard hashes
    c.fillRect(FX0+1,y,6,2); c.fillRect(FX1-7,y,6,2); // sideline ticks
  }
  // ---- yard numbers, rotated to face the sidelines, with drive arrows ----
  c.fillStyle='rgba(255,255,255,0.75)';
  for(let yd=10;yd<=90;yd+=10){
    const n=yd<=50?yd:100-yd, label=(n<10?'0':'')+n;
    [[FX0+32,Math.PI/2],[FX1-32,-Math.PI/2]].forEach(([x,rot])=>{
      c.save(); c.translate(x,Y(yd)); c.rotate(rot);
      c.font='bold 24px "Courier New",monospace'; c.textAlign='center'; c.textBaseline='middle';
      c.fillText(label,0,0);
      if(yd!==50){ // arrow points toward the nearer goal line
        const dir=(yd<50?-1:1)*(rot>0?1:-1);
        c.beginPath(); c.moveTo(dir*38,0); c.lineTo(dir*30,-6); c.lineTo(dir*30,6); c.fill();
      }
      c.restore();
    });
  }
  // ---- midfield logo ----
  c.save(); c.translate(W/2,Y(50));
  c.fillStyle='rgba(0,40,30,0.55)'; c.beginPath(); c.arc(0,0,40,0,7); c.fill();
  c.strokeStyle='#00b8a6'; c.lineWidth=4; c.beginPath(); c.arc(0,0,40,0,7); c.stroke();
  c.font='bold 26px "Courier New",monospace'; c.textAlign='center'; c.textBaseline='middle';
  c.lineWidth=4; c.strokeStyle='#053a35'; c.strokeText('VHH',0,0);
  c.fillStyle='#fff200'; c.fillText('VHH',0,0);
  c.restore();
  // ---- goal lines, boundary, pylons, goalposts ----
  c.fillStyle='#fff';
  c.fillRect(FX0,Y(0)-2,FW,4); c.fillRect(FX0,Y(100)-2,FW,4);
  c.fillStyle='#e8e8e8';
  c.fillRect(FX0-5,Y(-10)-5,FW+10,5); c.fillRect(FX0-5,Y(110),FW+10,5);   // end lines
  c.fillRect(FX0-5,Y(-10)-5,5,yd2y(120)+10); c.fillRect(FX1,Y(-10)-5,5,yd2y(120)+10); // sidelines
  c.fillStyle='#ff7a00';
  for(const gy of [Y(0),Y(100)]){ c.fillRect(FX0-7,gy-3,6,6); c.fillRect(FX1+1,gy-3,6,6); }
  for(const [gy,sign] of [[Y(-10),-1],[Y(110),1]]){ // top-down goalposts
    c.fillStyle='#ffd700';
    c.fillRect(W/2-2,gy,4,sign*8);
    c.fillRect(W/2-42,gy+sign*8-2,84,4);              // crossbar
    c.fillRect(W/2-44,gy+sign*8-2,6,6); c.fillRect(W/2+38,gy+sign*8-2,6,6); // uprights
  }
}
function drawField(camY){
  if(!fieldCv) buildField();
  const srcY=clamp(camY+FOFF,0,fieldCv.height-H);
  ctx.drawImage(fieldCv,0,srcY,W,H,0,0,W,H);
  // scrimmage + first down lines during drive
  if(['live','playcall','snap','dead'].includes(G.state)){
    const ly=yd2y(G.losYd)-camY;
    ctx.fillStyle='rgba(70,140,255,0.8)'; ctx.fillRect(FX0,ly-1,FX1-FX0,2);
    // chains slide to the new spot instead of teleporting
    if(G.fdDraw===undefined||Math.abs(G.fdDraw-G.firstYd)>30) G.fdDraw=G.firstYd;
    G.fdDraw=lerp(G.fdDraw,G.firstYd,0.16);
    const fy=yd2y(G.fdDraw)-camY;
    ctx.fillStyle='rgba(255,242,0,0.85)'; ctx.fillRect(FX0,fy-1,FX1-FX0,2);
  }
}
function drawBallFlight(camY){
  if(G.kickFlight){
    const k=G.kickFlight, t2=clamp(k.t/k.dur,0,1);
    const bx=lerp(k.fx,G.carrier.x,t2), by=lerp(k.fy,G.carrier.y,t2);
    const arc=Math.sin(Math.PI*t2)*170;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.arc(bx,by-camY,3,0,7);ctx.fill();
    ctx.fillStyle='#8a4b1f';
    ctx.save();ctx.translate(bx,by-camY-arc);ctx.rotate(t2*12);
    ctx.fillRect(-4,-3,8,6);ctx.fillStyle='#fff';ctx.fillRect(-1,-3,2,6);
    ctx.restore();
  }
  if(!G.ball)return;
  const b=G.ball,k=b.t/b.dur;
  const arc=Math.sin(Math.PI*clamp(k,0,1))*46;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.beginPath();ctx.arc(b.x,b.y-camY,3,0,7);ctx.fill();
  ctx.fillStyle='#8a4b1f';
  ctx.save();ctx.translate(b.x,b.y-camY-arc);ctx.rotate(k*9);
  ctx.fillRect(-4,-3,8,6);ctx.fillStyle='#fff';ctx.fillRect(-1,-3,2,6);
  ctx.restore();
}

/* ---------------- drawing: HUD ---------------- */
function drawHUD(){
  // score change detection: pop the number, announce lead changes
  if(G._ly===undefined){ G._ly=G.score.you; G._lc=G.score.cpu; }
  if(G.score.you!==G._ly||G.score.cpu!==G._lc){
    const was=Math.sign(G._ly-G._lc), now2=Math.sign(G.score.you-G.score.cpu);
    if(now2!==was&&now2!==0&&(G._ly||G._lc)){ // not the game's first score
      bigText(now2>0?'SKULLCRUSHERS TAKE THE LEAD!':'BRUISERS TAKE THE LEAD...',
        {y:H*0.6,size:22,color:now2>0?'#7dff6a':'#b06aff',dur:1.5});
      if(now2>0) sfx.cheer();
    }
    G.scorePop=0.5; G._ly=G.score.you; G._lc=G.score.cpu;
  }
  G.scorePop=Math.max(0,(G.scorePop||0)-0.016);
  const ss=20+(G.scorePop>0?Math.sin(G.scorePop*12)*5:0);
  ctx.fillStyle='rgba(8,8,14,0.92)'; ctx.fillRect(0,0,W,54);
  ctx.fillStyle='#00b8a6'; ctx.fillRect(8,8,14,14);
  pixelText('SKL '+G.score.you,30,16,ss,'#fff',null,false);
  ctx.fillStyle='#7a2fbf'; ctx.fillRect(130,8,14,14);
  pixelText('BRU '+G.score.cpu,152,16,ss,'#fff',null,false);
  // berserk vignette
  if(G.rampage>0){
    const a=0.10+0.06*Math.sin(G.titleT*10+G.t*10);

function drawIntro(dt){
  G.introT+=dt;
  const t=G.introT;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const fadeLine=(txt,start,y,size,color)=>{
    if(t>start){ ctx.globalAlpha=clamp((t-start)/0.9,0,1); pixelText(txt,W/2,y,size,color,null,true); ctx.globalAlpha=1; }
  };
  if(t<6.8){
    // slow, dramatic reveal — the last line lingers while the music builds
    fadeLine('IN 1994,',0.6,H*0.36,28,'#ddd');
    fadeLine('TWO FRIENDS DESIGNED',1.9,H*0.43,26,'#ddd');
    fadeLine('A VIDEO GAME.',2.8,H*0.49,26,'#ddd');
    fadeLine('THEY ONLY FINISHED THE COVER.',4.1,H*0.58,20,'#888');
  } else if(t<8.8){
    // darkness, crescendo still climbing... then:
    if(t>7.6){
      const k=clamp((t-7.6)/0.25,0,1);
      ctx.save();ctx.translate(W/2,H*0.48);ctx.scale(2.2-1.2*k,2.2-1.2*k);ctx.globalAlpha=k;
      pixelText('UNTIL NOW.',0,0,38,'#fff200','#000',true);
      ctx.restore();ctx.globalAlpha=1;
      if(!G.introUntilDone){G.introUntilDone=true;sfx.boom();shake=8;}
    }
  } else {
    // side view field strip
    const gy=H*0.55;
    ctx.fillStyle='#0d2d12';ctx.fillRect(0,gy-120,W,240);
    ctx.fillStyle='#1c7a2e';ctx.fillRect(0,gy+24,W,80);
    ctx.fillStyle='rgba(255,255,255,0.5)';
    for(let x=20;x<W;x+=70)ctx.fillRect(x,gy+24,3,80);
    // crowd
    for(let y=0;y<70;y+=8)for(let x=0;x<W;x+=8) if((x*7+y*13)%5<2){ctx.fillStyle=['#444','#665','#556'][(x+y)%3];ctx.fillRect(x,gy-118+y,5,5);}
    const ts=t-8.8;
    const impactT=2.2, FREEZE=0.2;
    const ix=70+100*impactT;        // runner position at the moment of impact
    const cx=ix+30;                 // tackler contact position
    if(ts<impactT){
      // runner jogs right, blissfully unaware, whistling to himself
      const rx=70+100*ts;
      drawBigGuy(rx,gy,TEAM_YOU,'run',false,true);
      if(ts<impactT-0.4){
        const bob=Math.sin(ts*9)*2;
        pixelText('♪ DOODLY DOO ♪',rx+14,gy-62+bob,16,'#9fd8ff','#000',true);
        G.introTuneT=(G.introTuneT||0)-dt;
        if(G.introTuneT<=0){
          G.introTuneT=0.9; G.introTuneN=(G.introTuneN||0)+1;
          if(G.introTuneN%2===1){ voiceDoodly(); }
          else {
            const seq=[784,988,880,1047];
            tone(seq[G.introTuneN%4],0.14,'sine',0.09);
            tone(seq[(G.introTuneN+1)%4],0.12,'sine',0.07,null,0.18);
          }
        }
      }
      // tackler rockets in from the right, timed to arrive exactly at the runner
      if(ts>impactT-0.5){
        const k=(ts-(impactT-0.5))/0.5;
        const mx=510-(510-cx)*k*k;
        drawBigGuy(mx,gy-6,TEAM_CPU,'missile',false,true);
      }
      // he hears something...
      if(ts>impactT-0.4){
        pixelText('?!',rx+6,gy-58+Math.sin(ts*30)*2,26,'#fff200','#000',true);
        if(!G.introWarnDone){G.introWarnDone=true;tone(1400,0.09,'square',0.13);tone(1400,0.09,'square',0.13,null,0.12);}
      }
    } else if(ts<impactT+FREEZE){
      // FREEZE FRAME: the moment of contact
      if(!G.introHitDone){G.introHitDone=true;sfx.megacrunch();sfx.boom();shake=22;}
      drawBigGuy(ix,gy,TEAM_YOU,'brace',false,true);
      drawBigGuy(cx,gy-6,TEAM_CPU,'missile',false,true);
      // impact starburst between them
      ctx.fillStyle='#fff200';
      const bx=ix+16,by=gy-10;
      for(let a=0;a<10;a++){
        const an=a/10*Math.PI*2+0.3, r2=30+(a%2)*14;
        ctx.beginPath();
        ctx.moveTo(bx+Math.cos(an-0.16)*12,by+Math.sin(an-0.16)*12);
        ctx.lineTo(bx+Math.cos(an)*r2,by+Math.sin(an)*r2);
        ctx.lineTo(bx+Math.cos(an+0.16)*12,by+Math.sin(an+0.16)*12);
        ctx.fill();
      }
      pixelText('POW!!',bx,gy-78,36,'#ff5050','#000',true);
      if(ts<impactT+0.06){ ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fillRect(0,0,W,H); }
    } else {
      const ps=ts-impactT-FREEZE;
      // victim launched left in a full somersault, lands flat on his back
      const pe=Math.min(ps,0.8);
      const fx=ix-pe*237, fy=gy+4-Math.sin(Math.PI*pe/0.8)*100;
      drawBigGuy(fx,fy,TEAM_YOU,'launched',false,false,-(pe/0.8)*(Math.PI*2+1.6));
      if(ps>=0.8&&!G.introLandDone){G.introLandDone=true;sfx.thud();spawnDust(fx,fy+10);shake=6;}
      if(ps>1.05&&ps<2.4){
        pixelText('YOWZGEES!!',Math.max(fx,40)+30,fy-46+Math.sin(ps*12)*2,20,'#fff200','#000',true);
        if(!G.introYowzDone){G.introYowzDone=true;voiceYowzgees();}
      }
      // helmet pops up-and-left with gravity, same direction as the hit
      const pl=Math.min(ps,1.35);
      const hx=ix-20-pl*130, hy=gy-40-300*pl+260*pl*pl;
      ctx.save();ctx.translate(hx,hy);ctx.rotate(-pl*7);drawHelmetIcon(0,0,16,TEAM_YOU.helmet,TEAM_YOU.stripe);ctx.restore();
      // tackler follows through a step, then stands over his work
      const tx=cx-Math.min(ps,0.3)*80;
      drawBigGuy(tx,gy+(ps<0.3?-6:6),TEAM_CPU,ps<0.3?'missile':'brace',ps>=0.3,true);
      if(ps<1.2)pixelText('C-R-R-RUNCH!!',W/2,H*0.25,40,'#ff5050','#000',true);
      if(ps>1.2){
        pixelText('VERY HARD',W/2,H*0.74,52,'#fff200','#7a1010',true);
        pixelText('HITTING FOOTBALL',W/2,H*0.81,40,'#fff200','#7a1010',true);
        if(!G.introTitleDone){G.introTitleDone=true;sfx.boom();sfx.fanfare();shake=14;}
      }
      if(ps>2.6){ stopIntroMusic(); setState('title'); }
    }
  }
  pixelText('TAP TO SKIP',W/2,H-28,14,'#555',null,true);
}

/* ---------------- title ---------------- */
// chunky word rendered to its own canvas; cracked=true bakes fracture lines into the letters
function wordCanvas(word,size,fill,outline,cracked){
  const font='bold '+size+'px Impact,"Arial Black","Helvetica Neue",sans-serif';
  const m=document.createElement('canvas'); const mc=m.getContext('2d');
  mc.font=font;
  m.width=Math.ceil(mc.measureText(word).width)+28; m.height=Math.ceil(size*1.35);
  mc.font=font; mc.textAlign='center'; mc.textBaseline='middle'; mc.lineJoin='round';
  mc.lineWidth=Math.max(7,size/7); mc.strokeStyle=outline;
  mc.strokeText(word,m.width/2,m.height/2);
  mc.fillStyle=fill; mc.fillText(word,m.width/2,m.height/2);
  if(cracked){
    mc.globalCompositeOperation='source-atop'; // cracks only land on the letters
    mc.strokeStyle='rgba(45,8,8,0.9)'; mc.lineWidth=2.5; mc.lineJoin='miter';
    for(let i=0;i<11;i++){
      let x=rnd(12,m.width-12), y=rnd(4,m.height*0.3);
      mc.beginPath(); mc.moveTo(x,y);
      const segs=3+(Math.random()*4|0);
      for(let s=0;s<segs;s++){ x+=rnd(-15,15); y+=rnd(8,m.height*0.18); mc.lineTo(x,y); }
      mc.stroke();
      mc.strokeStyle='rgba(255,255,255,0.3)'; mc.lineWidth=1; // hairline glint beside the crack
      mc.beginPath(); mc.moveTo(x+2,y-6); mc.lineTo(x+rnd(-8,8),y+rnd(4,10)); mc.stroke();
      mc.strokeStyle='rgba(45,8,8,0.9)'; mc.lineWidth=2.5;
    }
    mc.globalCompositeOperation='source-over';
  }
  return m;
}
function buildTitleArt(){
  G.titleArt={
    very:wordCanvas('VERY',80,'#fff200','#7a1010',false),
    hard:wordCanvas('HARD',80,'#fff200','#7a1010',false),
    hardCracked:wordCanvas('HARD',80,'#fff200','#7a1010',true),
    hitting:wordCanvas('HITTING FOOTBALL',44,'#fff200','#7a1010',false),
  };
}
function drawWord(img,cx,cy,scale,alpha,rot){
  ctx.save(); ctx.translate(cx,cy);
  if(rot) ctx.rotate(rot);
  ctx.scale(scale,scale);
  ctx.globalAlpha=alpha;
  ctx.drawImage(img,-img.width/2,-img.height/2);
  ctx.restore(); ctx.globalAlpha=1;
}
function drawTitle(dt){
  G.titleT+=dt;
  if(!G.titleArt) buildTitleArt();
  if(G.t<0.04) G.tf={};      // fresh entry: rearm the one-shot effects
  const tf=G.tf||(G.tf={});
  const t=G.t, A=G.titleArt;
  ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H*0.45,30,W/2,H*0.45,400);
  g.addColorStop(0,'#173a1e');g.addColorStop(1,'#0b0b1c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // frozen hit tableau
  const gy=H*0.46;
  drawBigGuy(W/2+60,gy-40,TEAM_YOU,'launched',false,false,-0.7);
  drawBigGuy(W/2-50,gy+10,TEAM_CPU,'missile',false,true);
  ctx.save();ctx.translate(W/2+150,gy-90);ctx.rotate(0.9);drawHelmetIcon(0,0,14,TEAM_YOU.helmet,TEAM_YOU.stripe);ctx.restore();
  pixelText('POW!',W/2+10,gy-90,30,'#ff5050','#000',true);
  // ---- the title assembles itself ----
  const bob=Math.sin(G.titleT*2)*4;
  const lineY=128+bob, subY=206+bob;
  const gap=14;
  const fitS=Math.min(1,(W-16)/(A.very.width+gap+A.hard.width)); // fallback fonts can run wide
  const hitS=Math.min(1,(W-16)/A.hitting.width);
  const lineW=(A.very.width+gap+A.hard.width)*fitS;
  const veryCx=W/2-lineW/2+A.very.width*fitS/2;
  const hardCxF=W/2+lineW/2-A.hard.width*fitS/2;
  const IMP=1.35, FLY=0.24;
  // HARD: slams in centered; the impact shoves it right and cracks it
  if(t>0.05){
    const k=clamp((t-0.05)/0.3,0,1);
    if(k>=1&&!tf.hardBoom){tf.hardBoom=true;sfx.boom();shake=8;}
    let hx=W/2, img=A.hard, rot=0;
    if(t>=IMP){
      img=A.hardCracked;
      const k2=clamp((t-IMP)/0.14,0,1);
      const c1=1.70158,c3=c1+1;
      const e=1+c3*Math.pow(k2-1,3)+c1*Math.pow(k2-1,2); // overshoot ease
      hx=lerp(W/2,hardCxF,e);
      if(t<IMP+0.45) rot=Math.sin((t-IMP)*40)*0.04*(1-(t-IMP)/0.45); // rattle
    }
    drawWord(img,hx,lineY,(1+(1-k)*1.4)*fitS,k,rot);
  }
  // HITTING FOOTBALL below
  if(t>0.55){
    const k=clamp((t-0.55)/0.18,0,1);
    if(k>=1&&!tf.subBoom){tf.subBoom=true;sfx.thud();shake=Math.max(shake,5);}
    drawWord(A.hitting,W/2,subY,(1+(1-k)*0.8)*hitS,k,0);
  }
  // VERY rockets in from the left and smashes into HARD
  if(t>IMP-FLY){
    if(t<IMP){
      const k=(t-(IMP-FLY))/FLY, e=k*k; // accelerating
      const vx=lerp(-A.very.width,veryCx,e);
      if(!tf.whoosh){tf.whoosh=true;noise(FLY+0.05,0.25,3500);}
      drawWord(A.very,vx-72,lineY,fitS,0.18,0); // motion ghosts
      drawWord(A.very,vx-38,lineY,fitS,0.18,0);
      drawWord(A.very,vx,lineY,(1.3-0.3*e)*fitS,1,0);
    } else {
      if(!tf.smash){
        tf.smash=true;
        sfx.megacrunch();sfx.boom();shake=18;flashWhite=0.12;
        spawnStars(veryCx+A.very.width/2+6,lineY,14);
        spawnDust(veryCx+A.very.width/2+6,lineY+12);
      }
      const rot=t<IMP+0.45?Math.sin((t-IMP)*40)*0.03*(1-(t-IMP)/0.45):0;
      drawWord(A.very,veryCx,lineY,fitS,1,rot);
    }
  }
  pixelText('SMASHVILLE SKULLCRUSHERS',W/2,H*0.62,18,'#00e5cf',null,true);
  pixelText('VS',W/2,H*0.645,14,'#888',null,true);
  pixelText('BONE COUNTY BRUISERS',W/2,H*0.67,18,'#b06aff',null,true);
  if(t>IMP&&Math.floor(G.titleT*2)%2===0)
    pixelText('TAP TO START',W/2,H*0.78,28,'#fff','#000',true);
  const sr=seriesText();
  if(sr) pixelText(sr,W/2,H*0.845,15,'#fff200',null,true);
  pixelText('© 1994 TWO GUYS WHO COULDN’T CODE',W/2,H*0.88,14,'#777',null,true);
  pixelText('32 YEARS IN DEVELOPMENT • WORTH IT',W/2,H*0.91,14,'#777',null,true);
  drawFxWorld(0); drawFxScreen(); // impact stars / flash live on the title screen
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const raw=Math.min(0.05,(now-last)/1000); last=now;
  let dt=raw;
  G.t+=raw;
  // consume taps
  let tapped=taps.length>0; taps.length=0;

  if(hitstop>0){ hitstop-=raw; dt=0; } // freeze gameplay during a VERY HARD HIT
  updateFx(raw);                       // fx, shake and shouts always tick

  ctx.save();
  if(shake>0) ctx.translate(rnd(-shake,shake)*0.5,rnd(-shake,shake)*0.5);
  if(zoomPunch>0){ // punch-zoom: the camera flinches with the hit
    const z=1+zoomPunch;
    ctx.translate(W/2,H/2); ctx.scale(z,z); ctx.translate(-W/2,-H/2);
  }

  switch(G.state){
    case 'boot':
      // tap gate: browsers refuse to play audio until a user gesture,
      // and the intro deserves its score
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
      pixelText('TOTAL NOG PRODUCTIONS',W/2,H*0.42,22,'#888',null,true);
      pixelText('PRESENTS',W/2,H*0.47,16,'#555',null,true);
      if(Math.floor(G.t*2)%2===0)pixelText('TAP TO BEGIN',W/2,H*0.62,26,'#fff200','#000',true);
      pixelText('SOUND ON. TRUST US.',W/2,H*0.68,14,'#666',null,true);
      if(tapped){ startIntroMusic(); setState('intro'); }
      break;
    case 'intro':
      if(G.introMusicWanted) realStartIntroMusic(G.introT); // late unlock: join the score in progress
      drawIntro(dt);
      if(tapped&&G.introT>0.5){ stopIntroMusic(); setState('title'); }
      break;
    case 'title':
      drawTitle(dt);
      if(tapped&&G.t>0.4) advanceTap();
      break;
    case 'howto':
      drawHowTo();
      if(tapped&&G.t>0.4) advanceTap();
      break;
    case 'playcall':
      if(buttons.length===0) setupPlaycallButtons();
      G.camY=lerp(G.camY,yd2y(G.losYd)-H*0.55,1-Math.pow(0.9,dt*60));
      drawPlaycall();
      break;
    case 'snap':
      drawField(G.camY);drawHUD();
      pixelText('HUT... HUT...',W/2,H*0.45,34,'#fff','#000',true);
      if(G.t>0.5) setupPlay(G.pendingPlay);
      break;
    case 'live':
      if(dt>0&&G.playLive) updateLive(dt);
      drawField(G.camY);
      for(const p of G.players) drawPlayer(p,G.camY);
      drawBallFlight(G.camY);
      drawFxWorld(G.camY);
      drawHUD(); drawButtons(); drawFxScreen();
      break;
    case 'dead': {
      G.playDeadT+=dt;
      const isTd=G.deadOpts&&G.deadOpts.td;
      if(isTd&&G.carrier){ // end zone celebration: hopping and fireworks
        G.carrier.y=G.celebBase-Math.abs(Math.sin(G.playDeadT*7))*16;
        G.carrier.moving=true; G.carrier.animT+=dt*1.6;
        if(frameCount%7===0) spawnStars(G.carrier.x+rnd(-44,44),G.carrier.y+rnd(-34,10),5);
      }
      drawField(G.camY);
      for(const p of G.players) drawPlayer(p,G.camY);
      drawFxWorld(G.camY); drawHUD(); drawFxScreen();
      if(G.deadMsg&&G.playDeadT>0.25)
        pixelText(G.deadMsg,W/2,H*0.5,30,'#fff','#000',true);
      if(G.playDeadT>(isTd?2.3:1.15)) afterPlay();
      break; }
    case 'banner': {
      drawField(G.camY); drawHUD(); drawFxWorld(G.camY); drawFxScreen();
      const b=G.banner; b.t+=dt;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H*0.32,W,H*0.3);
      ctx.fillStyle='#fff200';ctx.fillRect(0,H*0.32,W,4);ctx.fillRect(0,H*0.62-4,W,4);
      b.lines.forEach((ln,i)=>pixelText(ln,W/2,H*0.40+i*36,i===0?30:24,i===0?'#fff200':'#fff','#000',true));
      if(b.t>b.dur){ const nx=b.next; G.banner=null; nx(); }
      break; }
    case 'simdrive': {
      const s=G.sim; s.t+=dt;
      drawField(G.camY); drawHUD(); drawFxScreen();
      ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,H*0.25,W,H*0.42);
      pixelText('BRUISERS BALL...',W/2,H*0.31,26,'#b06aff','#000',true);
      if(s.t>0.8)pixelText(s.lines[0],W/2,H*0.40,18,'#ccc',null,true);
      if(s.t>1.7)pixelText(s.lines[1],W/2,H*0.46,18,'#ccc',null,true);
      if(s.t>1.0&&!s.c1){s.c1=true;sfx.thud();}
      // Q4/OT: the one-tap defensive stand — nail the sweeping marker to blow up the play
      if(s.qte&&!s.qte.done&&s.t>0.8&&s.t<2.6){
        s.qte.pos+=s.qte.dir*dt*1.2;
        if(s.qte.pos>1){s.qte.pos=1;s.qte.dir=-1;} if(s.qte.pos<0){s.qte.pos=0;s.qte.dir=1;}
        const bx=W*0.15,bw=W*0.7,by=H*0.70;
        pixelText('TAP TO BLOW IT UP!',W/2,by-26,18,'#7dff6a','#000',true);
        ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(bx,by,bw,16);
        ctx.fillStyle='rgba(125,255,106,0.5)';ctx.fillRect(bx+bw*0.39,by,bw*0.22,16);
        ctx.fillStyle='#fff';ctx.fillRect(bx+bw*s.qte.pos-2,by-4,4,24);
        if(tapped){
          s.qte.done=true;
          if(Math.abs(s.qte.pos-0.5)<0.11){
            s.qte.hit=true; s.outcome='stuffed'; s.pts=0;
            s.resultLines=[pick(SIM_DEF),'YOU BLEW IT UP YOURSELF!'];
            sfx.megacrunch(); shake=14; zoomPunch=0.08;
          } else {
            s.resultLines[1]=(s.resultLines[1]||'')+' (YOU MISSED THE TACKLE)';
            sfx.thud();
          }
        }
      }
      if(s.t>1.9&&!s.c2){s.c2=true;if(s.outcome==='stuffed'){sfx.megacrunch();shake=10;}else sfx.thud();}
      if(s.t>2.7){
        s.resultLines.forEach((ln,i)=>pixelText(ln,W/2,H*0.54+i*30,22,i===0?'#fff200':'#fff','#000',true));
        if(!s.scored){s.scored=true;G.score.cpu+=s.pts;if(s.pts>0)sfx.fail();else sfx.firstDown();}
      }
      if(s.t>4.2){ G.lastSimOutcome=s.outcome; G.sim=null; endQuarter(); }
      break; }
    case 'kickmeter': {
      const k=G.kick;
      k.t+=dt;
      k.pos+=k.dir*dt*1.4;
      if(k.pos>1){k.pos=1;k.dir=-1;} if(k.pos<0){k.pos=0;k.dir=1;}
      drawField(G.camY); drawHUD(); drawFxScreen();
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H*0.3,W,H*0.34);
      pixelText(k.type==='fg'?k.distYds+' YD FIELD GOAL':(k.type==='xp'?'EXTRA POINT':'PUNT'),W/2,H*0.36,28,'#fff200','#000',true);
      pixelText('TAP TO KICK!',W/2,H*0.42,20,'#fff','#000',true);
      const bx=W*0.12,bw=W*0.76,by=H*0.50;
      ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(bx,by,bw,20);
      const win=k.type==='punt'?0.5:k.window;
      ctx.fillStyle='rgba(125,255,106,0.5)';
      ctx.fillRect(bx+bw*(0.5-win/2),by,bw*win,20);
      ctx.fillStyle='#fff';ctx.fillRect(bx+bw*k.pos-2,by-5,4,30);
      if(tapped||k.t>4.2) resolveKick(); // hesitate forever and the snap gets away from you
      break; }
    case 'gameover': {
      ctx.fillStyle='#0b0b1c';ctx.fillRect(0,0,W,H);
      const win=G.result==='win';
      if(win){
        for(let i=0;i<3;i++){
          const fx=(i*160+80+Math.sin(G.t*2+i*2)*30), fy=120+((G.t*120+i*200)%500);
          spawnLite(fx,600-fy+120);
        }
      }
      pixelText(win?'SKULLCRUSHERS':'BRUISERS',W/2,H*0.18,40,win?'#00e5cf':'#b06aff','#000',true);
      pixelText(win?'WIN!':(G.score.you===G.score.cpu?'WIN IN OT!':'WIN!'),W/2,H*0.24,48,'#fff200','#000',true);
      pixelText('FINAL: SKL '+G.score.you+' — BRU '+G.score.cpu,W/2,H*0.34,24,'#fff',null,true);
      if(!win&&G.score.you===G.score.cpu)
        pixelText('OT RULE: SCORE OR LOSE. YOU KNOW WHAT YOU DID.',W/2,H*0.385,14,'#999',null,true);
      const sr=seriesText();
      if(sr) pixelText(sr,W/2,H*0.59,17,'#fff200',null,true);
      pixelText('VERY HARD HITS DELIVERED: '+G.vhhCount,W/2,H*0.44,20,'#7dff6a',null,true);
      pixelText('VERY HARD HITS RECEIVED: '+G.vhhTaken,W/2,H*0.49,20,'#ff8080',null,true);
      pixelText('LONGEST PLAY: '+G.longestPlay+' YDS',W/2,H*0.54,20,'#9fd8ff',null,true);
      pixelText(win?'TEXT YOUR FRIEND. TALK TRASH.':'REMATCH. IMMEDIATELY.',W/2,H*0.66,22,'#fff200','#000',true);
      if(Math.floor(G.t*2)%2===0)pixelText('TAP FOR REMATCH',W/2,H*0.78,24,'#fff','#000',true);
      pixelText('EST. 1994 • SHIPPED 2026',W/2,H*0.9,14,'#777',null,true);
      drawFxScreen2();
      if(tapped&&G.t>1.0) setState('title');
      break; }
  }
  ctx.restore();
  // watchdog: iOS can leave the context suspended/interrupted — keep nudging it
  if(AU.on&&frameCount%30===0&&AU.ctx.state!=='running'){ try{AU.ctx.resume();}catch(e){} }
  if(DEBUG){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,H-46,W,46);
    const ss=window.speechSynthesis;
    pixelText('au:'+(AU.on?AU.ctx.state:'off')+' tts:'+ttsDebug,8,H-32,13,'#7dff6a',null,false);
    pixelText(ss?('v:'+ss.getVoices().length+' spk:'+ss.speaking+' pen:'+ss.pending+' pau:'+ss.paused):'no-tts',8,H-13,13,'#7dff6a',null,false);
  }
  frameCount++;
}
let frameCount=0;
const liteParts=[];
function spawnLite(x,y){
  if(Math.random()<0.15)liteParts.push({x,y,t:0,c:pick(['#fff200','#00e5cf','#b06aff','#ff5050'])});
}
function drawFxScreen2(){
  for(let i=liteParts.length-1;i>=0;i--){
    const p=liteParts[i];p.t+=0.016;
    ctx.fillStyle=p.c;
    for(let a=0;a<6;a++){
      const an=a/6*Math.PI*2+p.t*3;
      ctx.fillRect(p.x+Math.cos(an)*p.t*120,p.y+Math.sin(an)*p.t*120,4,4);
    }
    if(p.t>0.7)liteParts.splice(i,1);
  }
}
requestAnimationFrame(frame);
</script>
